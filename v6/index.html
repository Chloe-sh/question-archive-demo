/* ===== 화면: 참고 기사 (이름과 주제는 산업 설정에서) ===== */
function viewRefs(r){
  var T=C.ind.refTopics, tp=r.params.get('topic')||'', sp=r.params.get('src')||'';
  var topic=has(T,tp)?tp:'', st=has(RSRC,sp)?sp:'';
  var list=C.refs.filter(function(a){return (!topic||a.topic===topic)&&(!st||a.stype===st);}).sort(function(a,b){return b.w-a.w;});
  var href=function(o){var s={topic:topic,src:st};Object.keys(o).forEach(function(k){s[k]=o[k];});return C.base+'/references'+qs(s);};
  function seg(label,key,map,cur,other){
    var base=C.refs.filter(other);
    var o1={};o1[key]='';
    return '<div class="seg noprint"><span class="lb">'+label+'</span><a href="'+href(o1)+'"'+(cur?'':CUR)+'>전체<small>'+base.length+'건</small></a>'+
      Object.keys(map).map(function(k){
        var n=count(base,function(a){return (key==='topic'?a.topic:a.stype)===k;}), o={};o[key]=k;
        return '<a href="'+href(o)+'"'+(cur===k?CUR:'')+'>'+esc(map[k])+'<small>'+n+'건</small></a>';
      }).join('')+'</div>';
  }
  var h='<header class="ph"><div><h1>'+esc(C.ind.refName)+'</h1><p class="sub">소비자 질문과 따로 모아요. 질문 수에 넣지 않아요.</p></div><p class="count" role="status"><b>'+list.length+'</b>건 / 전체 '+C.refs.length+'건</p></header>'+
    seg('주제','topic',T,topic,function(a){return !st||a.stype===st;})+
    seg('출처 구분','src',RSRC,st,function(a){return !topic||a.topic===topic;})+
    (list.length?'<ul class="hl">'+list.map(refItem).join('')+'</ul>':
      '<div class="empty" style="margin-top:20px"><h2>조건에 맞는 기사가 없어요</h2><p>주제나 출처 구분을 바꿔 주세요.</p><a class="btn" href="'+C.base+'/references">필터 모두 지우기</a></div>');
  return {title:C.ind.refName,nav:'references',html:h};
}

/* ===== 화면: 콘텐츠 아이디어 (3단계) ===== */
function viewIdeas(r){
  var tv=r.params.get('type'), t=(tv!==null&&/^\d$/.test(tv)&&Number(tv)<ITYPES.length)?Number(tv):-1;
  var list=C.ideas.filter(function(i){return t<0||i.type===t;});
  var h='<header class="ph"><div><h1>콘텐츠 아이디어 '+soon()+'</h1><p class="sub">편집 제안이에요. 소비자 질문 수에 넣지 않아요.</p></div><p class="count" role="status"><b>'+list.length+'</b>건 / 전체 '+C.ideas.length+'건</p></header>'+
    '<div class="seg noprint"><span class="lb">유형</span><a href="'+C.base+'/ideas"'+(t<0?CUR:'')+'>전체<small>'+C.ideas.length+'건</small></a>'+
    ITYPES.map(function(n,i){return '<a href="'+C.base+'/ideas?type='+i+'"'+(t===i?CUR:'')+'>'+esc(n)+'<small>'+count(C.ideas,function(x){return x.type===i;})+'건</small></a>';}).join('')+'</div>'+
    (list.length?'<table class="tbl" style="margin-top:20px"><thead><tr><th scope="col">제안</th><th scope="col">유형</th><th scope="col">근거 주제</th><th scope="col">근거 질문</th></tr></thead><tbody>'+
      list.map(function(i){
        var m=topicQs(i.group);
        return '<tr><td><b>'+esc(i.title)+'</b></td><td class="nw s">'+esc(ITYPES[i.type])+'</td><td>'+esc(TOPICS[i.group].name)+'<small>'+esc(PGN[TOPICS[i.group].pg])+'</small></td>'+
          '<td class="nw" data-l="근거 질문">'+m.length+'건'+(m.length?'<small><a href="'+listHref({topic:i.group})+'">질문 목록에서 보기</a></small>':'')+'</td></tr>';
      }).join('')+'</tbody></table>'
      :'<div class="empty" style="margin-top:20px"><h2>이 유형의 아이디어가 없어요</h2><p>다른 유형을 골라 주세요.</p><a class="btn" href="'+C.base+'/ideas">전체 보기</a></div>');
  return {title:'콘텐츠 아이디어',nav:'ideas',html:h};
}

/* ===== 화면: 주제 추이. 이 서비스의 중심 화면이에요 =====
   맨 위 한 문장, 숫자, 꺾은선 그래프, 같은 숫자의 표 순서예요 */
function fallTopics(B,wi){
  if(wi<=0)return [];
  return C.topics.map(function(g){
    var a=B.filter(function(q){return q.group===g;}), n=count(a,function(q){return q.w===wi;});
    return {g:g,n:n,d:n-count(a,function(q){return q.w===wi-1;})};
  }).filter(function(t){return t.d<0;}).sort(function(x,y){return x.d-y.d||y.n-x.n;});
}
/* 꺾은선 그래프. bk: 구간, ser: 계열(최대 6개), vpos: 지시문 변경선의 가로 위치(구간 순번, 소수 가능) */
function lineChart(bk,ser,vpos,desc){
  var W=920,Hh=340,L=44,R=184,T=36,B=64,n=bk.length;
  var max=1;
  ser.forEach(function(s){s.v.forEach(function(v){if(v!==null&&v>max)max=v;});});
  max=Math.max(4,Math.ceil(max/4)*4);
  var step=(W-L-R-24)/(n-1);
  var x=function(i){return L+12+i*step;}, y=function(v){return T+(1-v/max)*(Hh-T-B);};
  var s='';
  for(var t=1;t<=4;t++){var tv=max/4*t;s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(tv)+'" y2="'+y(tv)+'"/><text class="tick" x="'+(L-8)+'" y="'+(y(tv)+5)+'" text-anchor="end">'+tv+'</text>';}
  s+='<line class="base" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'"/><text class="tick" x="'+(L-8)+'" y="'+(y(0)+5)+'" text-anchor="end">0</text>';
  /* 구간마다 한 칸. 포커스나 마우스가 오면 그 구간의 계열별 건수를 한 상자에 보여 줘요 */
  var tips=[];
  bk.forEach(function(b,i){
    var fl=[];
    if(b.partial)fl.push('부분 조사');
    if(b.gap)fl.push(b.gapDays&&b.gapDays.length?'조사가 빠진 날 '+b.gapDays.join(', ')+'이 있어요':'조사가 빠진 날이에요');
    var flag=fl.join(', ');
    var lines=ser.map(function(sr){return sr.v[i]===null?sr.name+' 조사 없음':sr.name+' '+sr.v[i]+'건';});
    tips.push({title:b.title+(flag?', '+flag:''),rows:ser.map(function(sr){return [sr.name,sr.v[i]===null?'조사 없음':sr.v[i]+'건'];}),x:x(i)/W});
    s+='<g class="col" tabindex="0" role="img" data-i="'+i+'" aria-label="'+esc(b.title+(flag?', '+flag:'')+'. '+lines.join(', '))+'"><rect class="hit" x="'+(x(i)-step/2).toFixed(1)+'" y="'+T+'" width="'+step.toFixed(1)+'" height="'+(Hh-B-T)+'"/></g>';
  });
  if(vpos!==null){
    var vx=x(vpos).toFixed(1);
    s+='<line class="vm" x1="'+vx+'" x2="'+vx+'" y1="'+(T-10)+'" y2="'+y(0)+'"/><text class="vt" x="'+(Number(vx)+6)+'" y="'+(T-14)+'">분류 기준 바뀜</text>';
  }
  var skip=n>8?2:1;
  bk.forEach(function(b,i){
    if((n-1-i)%skip===0)s+='<text class="'+(b.hollow?'xp':'xl')+'" x="'+x(i).toFixed(1)+'" y="'+(Hh-B+22)+'" text-anchor="middle">'+b.label+'</text>';
    if(b.hollow)s+='<text class="xp" x="'+x(i).toFixed(1)+'" y="'+(Hh-B+44)+'" text-anchor="middle">'+(n>8?(b.gap?'빠짐':'부분'):(b.partial?'부분 조사':'빠진 날 있음'))+'</text>';
  });
  /* 계열: 선 모양과 농도로 구분. 끝 점 옆에 이름을 직접 적고, 겹치면 세로로 벌려요 */
  var labs=[];
  ser.forEach(function(sr,j){
    var segs=[], cur=[], last=null;
    sr.v.forEach(function(v,i){
      if(v===null){if(cur.length)segs.push(cur);cur=[];}
      else{cur.push([x(i),y(v),i]);last=cur[cur.length-1];}
    });
    if(cur.length)segs.push(cur);
    var g='<g class="g l'+(j+1)+'" data-k="'+esc(sr.k)+'">'+segs.map(function(sg){
      return sg.length>1?'<polyline class="ser" points="'+sg.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ')+'"/>':'';
    }).join('')+segs.map(function(sg){return sg.map(function(p){
      return '<circle class="d'+(bk[p[2]].hollow?' h':'')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.5"/>';
    }).join('');}).join('')+'</g>';
    s+=g;
    if(last)labs.push({j:j,sr:sr,px:last[0],py:last[1],ly:last[1]});
  });
  labs.sort(function(a,b){return a.ly-b.ly;});
  for(var a=1;a<labs.length;a++){if(labs[a].ly<labs[a-1].ly+20)labs[a].ly=labs[a-1].ly+20;}
  var bottom=Hh-B+4;
  for(var c=labs.length-1;c>=0;c--){var lim=c===labs.length-1?bottom:labs[c+1].ly-20;if(labs[c].ly>lim)labs[c].ly=lim;}
  labs.forEach(function(lb){
    var nm=lb.sr.name.length>11?lb.sr.name.slice(0,10)+'…':lb.sr.name, lx=lb.px+16, wd=nm.length*14+14;
    if(Math.abs(lb.ly-lb.py)>6)s+='<line class="ld" x1="'+(lb.px+6).toFixed(1)+'" y1="'+lb.py.toFixed(1)+'" x2="'+(lx-4).toFixed(1)+'" y2="'+lb.ly.toFixed(1)+'"/>';
    s+='<g class="sl" tabindex="0" role="button" aria-pressed="false" data-k="'+esc(lb.sr.k)+'" aria-label="'+esc(lb.sr.name)+', 누르면 이 계열만 진하게 봐요"><rect class="slr" x="'+(lx-5).toFixed(1)+'" y="'+(lb.ly-12).toFixed(1)+'" width="'+wd+'" height="24" rx="3"/>'+
      '<text class="sln" x="'+lx.toFixed(1)+'" y="'+(lb.ly+5).toFixed(1)+'">'+esc(nm)+'</text></g>';
  });
  return {html:'<div class="lcw"><figure class="chart lc" id="lc"><svg viewBox="0 0 '+W+' '+Hh+'" role="group" aria-label="'+esc(desc)+'">'+s+'</svg></figure><div class="lct" id="lc-tip" hidden></div></div>',tips:tips};
}
/* 일 단위 작은 그래프 묶음. 맨 위 전체 한 줄과 계열별 한 줄, 모든 줄이 같은 가로축과 같은 세로 최댓값을 써요 */
function dayChart(bk,all,rows,vpos,desc){
  var W=960,X0=248,slot=34,barW=20,RX=744,n=bk.length,top=26,bh=32,pitch=50;
  /* 전체 줄과 계열 줄은 세로 최댓값을 따로 써요. 계열 줄끼리는 같은 최댓값이라 서로 견줄 수 있어요 */
  var list=[all].concat(rows), max=2, amax=2;
  rows.forEach(function(r0){r0.v.forEach(function(v){if(v!==null&&v>max)max=v;});});
  all.v.forEach(function(v){if(v!==null&&v>amax)amax=v;});
  var Hrows=top+list.length*pitch, Hh=Hrows+54, s='', tips=[];
  var cx=function(i){return X0+i*slot+slot/2;};
  list.forEach(function(r0,j){
    var y0=top+j*pitch+bh, mid=y0-bh/2;
    s+='<line class="'+(j===0?'base':'rl')+'" x1="'+X0+'" x2="'+(X0+n*slot)+'" y1="'+y0+'" y2="'+y0+'"/>';
    r0.v.forEach(function(v,i){
      if(v===null){if(j===0)s+='<text class="xp" x="'+cx(i).toFixed(1)+'" y="'+(mid+5)+'" text-anchor="middle">빠짐</text>';return;}
      if(v>0){var bhh=Math.max(3,v/(j===0?amax:max)*bh);s+='<rect class="bar'+(bk[i].hollow?' h':'')+'" x="'+(cx(i)-barW/2).toFixed(1)+'" y="'+(y0-bhh).toFixed(1)+'" width="'+barW+'" height="'+bhh.toFixed(1)+'"/>';}
    });
    var nm=r0.name.length>14?r0.name.slice(0,13)+'…':r0.name;
    s+=(r0.to?'<a href="'+r0.to+'" aria-label="'+esc(r0.name+', 누르면 이 조건의 질문 목록으로 가요')+'"><text class="rn" x="0" y="'+(mid+5)+'">'+esc(nm)+'</text></a>':'<text class="rt" x="0" y="'+(mid+5)+'">'+esc(nm)+'</text>');
    var a=r0.v.slice(n-7).reduce(function(x,y){return x+(y||0);},0), b=r0.v.slice(0,n-7).reduce(function(x,y){return x+(y||0);},0);
    s+='<text class="rt" x="'+RX+'" y="'+(mid-2)+'">'+r0.tot+'건</text><text class="rs" x="'+RX+'" y="'+(mid+16)+'">'+esc(dPhrase(a-b,'앞선 7일'))+'</text>';
  });
  s+='<text class="xs" x="'+RX+'" y="12">막대 높이: 전체 줄은 하루 '+amax+'건, 나머지 줄은 하루 '+max+'건이 가장 높아요</text>';
  if(vpos!==null){
    var vx=cx(vpos).toFixed(1);
    s+='<line class="vm" x1="'+vx+'" x2="'+vx+'" y1="'+(top-6)+'" y2="'+Hrows+'"/><text class="vt" x="'+(Number(vx)+6)+'" y="'+(top-10)+'">분류 기준 바뀜</text>';
  }
  bk.forEach(function(b,i){
    var fl=[];
    if(b.partial)fl.push('부분 조사');
    if(b.gap)fl.push('조사가 빠진 날이에요');
    var flag=fl.join(', ');
    var shown=list.filter(function(r0,j){return j===0||(r0.v[i]!==null&&r0.v[i]>0);});
    tips.push({title:b.title+(flag?', '+flag:''),rows:shown.map(function(r0){return [r0.name,r0.v[i]===null?'조사 없음':r0.v[i]+'건'];}),x:cx(i)/W});
    s+='<g class="col" tabindex="0" role="img" data-i="'+i+'" aria-label="'+esc(b.title+(flag?', '+flag:'')+'. '+list.map(function(r0){return r0.name+' '+(r0.v[i]===null?'조사 없음':r0.v[i]+'건');}).join(', '))+'"><rect class="hit" x="'+(X0+i*slot)+'" y="'+(top-6)+'" width="'+slot+'" height="'+(Hrows-top+6)+'"/></g>';
    if((n-1-i)%2===0)s+='<text class="'+(b.hollow?'xp':'xl')+'" x="'+cx(i).toFixed(1)+'" y="'+(Hrows+22)+'" text-anchor="middle">'+b.label+'</text>';
    if(b.hollow)s+='<text class="xp" x="'+cx(i).toFixed(1)+'" y="'+(Hrows+44)+'" text-anchor="middle">'+(b.gap?'빠짐':'부분')+'</text>';
  });
  return {html:'<div class="lcw dcw"><figure class="chart lc dc" id="lc"><svg viewBox="0 0 '+W+' '+Hh+'" role="group" aria-label="'+esc(desc)+'">'+s+'</svg></figure><div class="lct" id="lc-tip" hidden></div></div>',tips:tips};
}
function viewTrends(r){
  var p=r.params, by=p.get('by'), unit=p.get('unit')==='day'?'day':'week';
  by=(by==='type'||by==='topic')?by:'pg';
  var pv=p.get('pg')||'', pg=C.pgs.indexOf(pv)>=0?pv:'';
  var href=function(o){var s={by:by==='pg'?'':by,unit:unit==='day'?'day':'',pg:pg};Object.keys(o).forEach(function(k){s[k]=o[k];});return C.base+'/trends'+qs(s);};
  var ind=C.client.ind, vpos=null;
  /* 구간: 주 단위는 5주, 일 단위는 최근 14일 */
  var bk=[];
  if(unit==='week'){
    C.weeks.forEach(function(w){
      var gapDays=[];
      for(var k=6;k>=0;k--){var d=addDays(w.date,-k),st=runStatus(ind,d);if(w.i>0&&(st==='missed'||st==='failed'))gapDays.push(d.slice(5));}
      bk.push({i:w.i,label:w.no+'주',title:w.no+'주차, 조사일 '+w.date.slice(5),hollow:w.scope==='partial'||gapDays.length>0,gap:gapDays.length>0,gapDays:gapDays,partial:w.scope==='partial'});
    });
    for(var wi=0;wi<WEEKS.length-1;wi++){if(V4_FROM>WEEKS[wi].date&&V4_FROM<=WEEKS[wi+1].date)vpos=wi+(toMs(V4_FROM)-toMs(WEEKS[wi].date))/86400000/7;}
  }else{
    for(var k2=13;k2>=0;k2--){
      var dd=addDays(C.latest.date,-k2), s2=runStatus(ind,dd);
      bk.push({date:dd,label:dd.slice(5),title:dd.slice(5)+' 조사',hollow:s2!=='ok',gap:s2==='missed'||s2==='failed',partial:s2==='partial'});
      if(dd===V4_FROM)vpos=bk.length-1;
    }
  }
  var base=C.Q.filter(function(q){return !pg||q.pg===pg;});
  var defs;
  if(by==='pg')defs=C.pgs.filter(function(k){return !pg||k===pg;}).map(function(k){return {k:k,name:PGN[k],fn:function(q){return q.pg===k;},to:listHref({pg:k})};});
  else if(by==='type')defs=Object.keys(TYPES).map(function(k){return {k:k,name:TYPES[k],fn:function(q){return q.types.indexOf(k)>=0;},to:listHref({type:k,pg:pg})};});
  else defs=C.topics.filter(function(g){return !pg||TOPICS[g].pg===pg;}).map(function(g){return {k:g,name:TOPICS[g].name,fn:function(q){return q.group===g;},to:listHref({topic:g})};});
  var sum=function(a){return a.reduce(function(x,y){return x+(y||0);},0);};
  var rows=defs.map(function(d){
    var v=bk.map(function(b){
      if(unit==='day'&&b.gap)return null;
      return count(base,function(q){return d.fn(q)&&(unit==='week'?q.w===b.i:q.day===b.date);});
    });
    return {k:d.k,name:d.name,v:v,tot:sum(v),to:d.to};
  }).sort(function(a,b){return b.tot-a.tot||(a.name<b.name?-1:1);});
  var withN=rows.filter(function(x){return x.tot>0;}), drawn=withN.slice(0,6), cut=withN.length-drawn.length;
  var allRow={k:'__all',name:'전체',to:'',v:bk.map(function(b){return (unit==='day'&&b.gap)?null:count(base,function(q){return unit==='week'?q.w===b.i:q.day===b.date;});})};
  allRow.tot=sum(allRow.v);
  var ub=by==='pg'?'제품군':(by==='type'?'질문 유형':'주제');
  /* 1. 결론 한 문장 */
  var rises=riseTopics(C.Q,C.latest.i,ind), falls=fallTopics(C.Q,C.latest.i);
  var lead=(rises.length?riseLead(rises[0],'이번 주','지난주'):'지난주보다 늘어난 주제는 없어요.')+' '+
    (falls.length?'가장 많이 줄어든 주제는 \''+TOPICS[falls[0].g].name+'\''+ie(TOPICS[falls[0].g].name)+'(이번 주 '+falls[0].n+'건, '+(-falls[0].d)+'건 줄었어요).':'줄어든 주제는 없어요.');
  /* 2. 숫자 */
  var nowN=count(base,function(q){return q.w===C.latest.i;}), prevN=count(base,function(q){return q.w===C.prev.i;});
  var span=unit==='week'?C.weeks[0].no+'주차부터 '+C.latest.no+'주차까지':bk[0].label+'부터 '+bk[bk.length-1].label+'까지';
  var flagCmp=partialCmp(C.latest.i);
  var h='<header class="ph"><div><h1>주제 추이</h1><p class="sub">'+esc(lead)+'</p></div><dl class="facts"><div><dt>최근 업데이트</dt><dd>'+runStamp(lastOkRun(ind))+'</dd></div><div><dt>조사 범위</dt><dd>'+scope(C.latest)+'</dd></div></dl></header>'+
    '<section class="kb" aria-label="이번 주 숫자"><div><p class="kpi-l">'+(pg?esc(PGN[pg])+' ':'')+'이번 주 새 질문</p><span class="kpi">'+nowN+'<small>건</small></span></div>'+
    '<p class="prev">'+esc(dPhrase(nowN-prevN,'지난주('+prevN+'건)'))+'. '+(flagCmp?PMT:'')+'</p>'+
    '<p class="prev">늘어난 주제 '+rises.length+'개, 줄어든 주제 '+falls.length+'개예요(지난주 기준).</p></section>'+
    '<div class="ctl noprint"><div class="seg" role="group" aria-label="보기 기준"><span class="lb">보기 기준</span>'+
    [['pg','제품군별'],['type','질문 유형별'],['topic','주제별']].map(function(o){return '<a href="'+href({by:o[0]==='pg'?'':o[0]})+'"'+(by===o[0]?CUR:'')+'>'+o[1]+'</a>';}).join('')+'</div>'+
    '<div class="seg" role="group" aria-label="단위"><span class="lb">단위</span><a href="'+href({unit:''})+'"'+(unit==='week'?CUR:'')+'>주 단위(5주)</a><a href="'+href({unit:'day'})+'"'+(unit==='day'?CUR:'')+'>일 단위(최근 14일)</a></div>'+
    '<div class="f"><label for="tr-pg">제품군</label><select class="sel'+(pg?' on':'')+'" id="tr-pg" data-go><option value="'+href({pg:''})+'">전체 제품군</option>'+
    C.pgs.map(function(k){return '<option value="'+href({pg:k})+'"'+(pg===k?' selected':'')+'>'+esc(PGN[k])+'</option>';}).join('')+'</select></div></div>';
  /* 3. 그래프 */
  var tips=[];
  h+='<section><h2>'+(pg?esc(PGN[pg])+', ':'')+ub+'별 '+(unit==='week'?'주별':'일별')+' 새 질문 수'+(unit==='week'&&cut>0?'<span class="cutn">건수가 많은 '+drawn.length+'개만 그렸어요</span>':'')+'</h2>';
  if(unit==='day'&&rows.length){
    var dc=dayChart(bk,allRow,rows,vpos,ub+'별 일별 새 질문 수 막대 그래프. '+span+'. 날짜에 포커스하면 그 날의 건수를 읽어 줘요.');
    tips=dc.tips;
    h+=dc.html;
  }else if(unit==='week'&&drawn.length){
    var cc=lineChart(bk,drawn,vpos,ub+'별 주별 새 질문 수 꺾은선 그래프. '+span+'. 같은 숫자가 아래 표에 있어요.');
    tips=cc.tips;
    h+=cc.html;
  }else h+='<div class="empty sm"><p>이 조건에는 그릴 질문이 없어요.</p></div>';
  h+='<p class="note">'+(unit==='week'?'속이 빈 점은':'테두리만 있는 막대는')+' 부분 조사'+(vpos!==null?', 세로선은 '+V4_FROM+' 분류 기준 변경이에요. 앞뒤 숫자를 그대로 견주기 어려워요.':'예요.')+'</p>';
  h+='<p class="note">늘었다고 보는 기준은 아직 정하지 않았어요. 지금은 건수 차이만 보여 줘요.</p></section>';
  /* 4. 같은 숫자의 표. 일 단위는 그래프의 날짜별 읽어 주기로 갈음해요 */
  var cmpName=unit==='week'?'지난주':'앞선 7일';
  var maxAll=Math.max.apply(null,rows.map(function(x){return Math.max.apply(null,x.v.map(function(z){return z||0;}));}).concat([1]));
  if(unit==='week')h+='<section class="sec"><h2>'+ub+'별 건수 표</h2>'+(rows.length?'<table class="tbl go"><thead><tr><th scope="col">'+ub+'</th><th scope="col">'+(unit==='week'?'주별':'일별')+' 건수, '+span+'</th><th scope="col" class="n">합계</th><th scope="col">'+cmpName+'와 비교</th><th scope="col">추이</th></tr></thead><tbody>'+
    rows.map(function(x){
      var n=x.v.length, a,b,hol;
      if(unit==='week'){a=x.v[n-1]||0;b=x.v[n-2]||0;hol=bk[n-1].hollow||bk[n-2].hollow;}
      else{a=sum(x.v.slice(n-7));b=sum(x.v.slice(n-14,n-7));hol=bk.slice(0,n).some(function(z){return z.hollow;});}
      return '<tr data-href="'+x.to+'"><td><a class="t" href="'+x.to+'">'+esc(x.name)+'</a></td><td class="nw" data-l="'+(unit==='week'?'주별':'일별')+' 건수">'+x.v.map(function(z){return z===null?'-':z;}).join(', ')+'</td>'+
        '<td class="n" data-l="합계"><b>'+x.tot+'건</b></td><td data-l="비교">'+esc(dPhrase(a-b,cmpName))+(hol?'<small>'+PMT+'</small>':'')+'</td><td>'+spark(x.v.map(function(z){return z||0;}),maxAll)+'</td></tr>';
    }).join('')+'</tbody></table>':'<div class="empty sm"><p>이 제품군에 묶인 주제가 없어요.</p></div>')+
    '<p class="note">'+(by==='type'?'한 질문에 질문 유형이 여러 개 붙을 수 있어서 합계가 전체 질문 수보다 클 수 있어요. ':'')+(by==='topic'?'묶음이 없는 질문은 주제별 표에 넣지 않았어요. ':'')+'건수 옆 "-"는 조사가 빠진 날이에요. 줄을 누르면 그 조건이 걸린 질문 목록으로 가요.</p></section>';
  return {title:'주제 추이',nav:'trends',html:h,init:function(){
    var fig=document.getElementById('lc'), tip=document.getElementById('lc-tip');
    if(!fig)return;
    var showTip=function(i){
      var t=tips[i], box=fig.parentNode, w=box.clientWidth, px=t.x*fig.clientWidth;
      tip.innerHTML='<b>'+esc(t.title)+'</b>'+t.rows.map(function(rw){return '<span><span>'+esc(rw[0])+'</span><span>'+esc(rw[1])+'</span></span>';}).join('');
      tip.hidden=false;
      var left=px+14; if(left+tip.offsetWidth>w)left=px-tip.offsetWidth-14; if(left<0)left=0;
      tip.style.left=left+'px';
    };
    var hideTip=function(){tip.hidden=true;};
    var cols=fig.querySelectorAll('.col'), i;
    for(i=0;i<cols.length;i++){(function(c){
      var n=Number(c.getAttribute('data-i'));
      c.addEventListener('mouseenter',function(){showTip(n);});
      c.addEventListener('mouseleave',hideTip);
      c.addEventListener('focus',function(){showTip(n);});
      c.addEventListener('blur',hideTip);
    })(cols[i]);}
    var sel=null;
    var pick=function(k){
      sel=sel===k?null:k;
      fig.classList.toggle('hs',sel!==null);
      var gs=fig.querySelectorAll('.g'), ls=fig.querySelectorAll('.sl'), j;
      for(j=0;j<gs.length;j++){gs[j].classList.toggle('on',gs[j].getAttribute('data-k')===sel);}
      for(j=0;j<ls.length;j++){var on=ls[j].getAttribute('data-k')===sel;ls[j].classList.toggle('on',on);ls[j].setAttribute('aria-pressed',on?'true':'false');}
    };
    var labs=fig.querySelectorAll('.sl'), m;
    for(m=0;m<labs.length;m++){(function(l){
      l.addEventListener('click',function(){pick(l.getAttribute('data-k'));});
      l.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(l.getAttribute('data-k'));}});
    })(labs[m]);}
  }};
}

/* ===== 화면: 통합 동향 (시하 내부). 위에서 아래로 읽는 화면이에요 =====
   요약 세 줄, 좋아한 것과 싫어한 것, 지금 회자되는 브랜드 이슈, 커뮤니티에서 많이 묻는 것, 지난주보다 늘어난 주제 */
function viewSiha(r){
  var p=r.params, P=readPeriod(p), ikv=p.get('ik')||'', ik=(ikv==='neg'||ikv==='pos')?ikv:'';

  var rows=commRows(cur,prev,INDK,hasPrev,wi).filter(function(x){return x.n>0;}).sort(function(a,b){return b.n-a.n;});
  var RK=rpRank(P,null), KT=kindTotals(P.win,null), K7=kindTotals(W7,null);
  var nPend=count(cur,function(q){return q.review==='pending';});
  var rise=riseTopics(C.Q,wi,'');
  var commHref=C.base+'/communities';

  var qLine=cur.length?'이번 주에 새 질문이 '+cur.length+'건 들어왔어요. '+SRC[rows[0].s]+'에서 가장 많이 나왔어요('+rows[0].n+'건).':'이번 주에는 새 질문이 없어요.';
  var h='<header class="ph"><div><h1>통합 동향</h1><p class="sub">소비자 질문 조사일 '+L.date+', 브랜드 이슈 최근 실행 '+REF+'</p></div></header>'+
    '<ul class="sum" aria-label="요약"><li><span>질문</span><p>'+esc(qLine)+'</p></li>'+
    '<li><span>좋아한 것</span><p>'+esc(topLine(P,RK.pos[0],'pos',false))+'</p></li>'+
    '<li><span>싫어한 것</span><p>'+esc(topLine(P,RK.neg[0],'neg',false))+'</p></li></ul>';
  /* 2. 좋아한 것과 싫어한 것. 기간 선택이 여기에 붙어요 */
  h+='<section class="sec"><div class="sh"><h2>사람들이 좋아한 것, 싫어한 것</h2><a href="'+C.base+'/insights'+qs(pq(P))+'">반응 인사이트에서 더 보기</a></div>'+
    '<p class="lead">'+(P.err?'기간을 다시 골라 주세요.':esc(P.span+' 동안 원문을 확인한 글은 긍정 '+KT.pos.posts+'건, 부정 '+KT.neg.posts+'건이에요.'))+'</p>'+
    periodBar(P,href)+
    '<div class="c2" style="margin-top:24px">'+['pos','neg'].map(function(kd){
      return '<div><h3>'+(kd==='pos'?'사람들이 좋아한 것':'사람들이 싫어한 것')+kdTag(kd)+'</h3>'+
        '<div style="margin-top:12px">'+rpRows(RK[kd],kd,{P:P,n:3,rep:true})+'</div></div>';
    }).join('')+'</div>'+
    '<p class="note">반응 포인트마다 그 기간에 올라온 원문 확인 글 수를 세어 순위를 매겨요. '+NOTE_KIND+'</p></section>';
  /* 3. 지금 회자되는 브랜드 이슈. 항상 최근 1주일 */
  var rec=recentIssues().filter(function(e){return !ik||e.x.kind===ik;}).slice(0,5), lim=limitedNames();
  h+='<section class="sec"><div class="sh"><h2>지금 회자되는 브랜드 이슈</h2><a href="'+C.base+'/issues">브랜드 이슈에서 더 보기</a></div>'+
    '<p class="lead">'+esc('최근 1주일 동안 원문을 확인한 이슈는 부정 '+K7.neg.issues+'건(글 '+K7.neg.posts+'건), 긍정 '+K7.pos.issues+'건(글 '+K7.pos.posts+'건)이에요.')+'</p>'+
    '<div class="seg noprint" role="group" aria-label="구분"><a href="'+href({ik:''})+'"'+(ik?'':CUR)+'>전체</a><a href="'+href({ik:'neg'})+'"'+(ik==='neg'?CUR:'')+'>부정</a><a href="'+href({ik:'pos'})+'"'+(ik==='pos'?CUR:'')+'>긍정</a></div>'+
    (rec.length?'<ul class="ls" style="margin-top:14px">'+rec.map(function(e){
      var x=e.x;
      return '<li><p class="hd">'+kdTag(x.kind)+'<b>'+brandTag(x)+'</b><span>'+esc(x.type)+'</span></p>'+
        '<a class="t" href="'+C.base+'/issues/'+x.id+'">'+esc(x.summary)+'</a>'+
        '<p class="m">글 '+e.c7+'건, 커뮤니티 '+e.comms+'곳, 처음 확인 '+x.first.slice(5,10)+(e.c24?', 최근 24시간에 '+e.c24+'건':'')+'</p></li>';
    }).join('')+'</ul>':'<div class="empty sm" style="margin-top:14px"><p>최근 1주일에 원문을 확인한 '+(ik?IKIND[ik]+' ':'')+'이슈가 없어요.</p></div>')+
    '<p class="note">최근 24시간에 글이 늘어난 순으로 다섯 건까지 보여요. 글 수는 원문 확인 글만 세요.'+(lim.length?' 최근 실행에서 확인 제한 '+lim.length+'곳: '+lim.map(esc).join(', ')+'.':'')+'</p></section>';
  /* 4. 커뮤니티에서 많이 묻는 것 */
  h+='<section class="sec"><div class="sh"><h2>커뮤니티에서 많이 묻는 것</h2><a href="'+commHref+'">커뮤니티별 질문에서 더 보기</a></div>';
  if(rows.length){
    h+='<p class="lead">'+esc('이번 주에 질문이 나온 커뮤니티는 '+rows.length+'곳이에요. '+rows.slice(0,3).map(function(x){return SRC[x.s];}).join(', ')+' 순으로 많아요.')+'</p>'+
      '<table class="tbl go"><thead><tr><th scope="col">커뮤니티</th><th scope="col">이번 주 건수</th><th scope="col">많이 나온 주제</th><th scope="col">대표 질문</th></tr></thead><tbody>'+
      rows.slice(0,5).map(function(x){
        var u=commHref+qs({open:x.s});
        return '<tr data-href="'+u+'"><td class="nw"><a class="t" href="'+u+'">'+esc(SRC[x.s])+'</a></td>'+commCells(x,hasPrev,'지난주',3)+'</tr>';
      }).join('')+'</tbody></table>'+
      '<p class="note">'+NOTE_DELTA+(nPend?' 검수 대기 '+nPend+'건을 포함한 숫자예요.':'')+'</p>';
  }else h+='<p class="lead">이번 주에는 새 질문이 없어요.</p>';
  h+='</section>';
  /* 5. 지난주보다 늘어난 주제 */
  h+='<section class="sec"><div class="sh"><h2>지난주보다 늘어난 주제</h2><a href="'+commHref+'">커뮤니티별 질문에서 더 보기</a></div>'+
    (rise.length?'<p class="lead">'+esc(riseLead(rise[0],'이번 주','지난주'))+'</p>'+riseList(rise.slice(0,5),'지난주',wi,false,L.date):
      '<p class="lead">'+(hasPrev?'지난주보다 늘어난 주제가 없어요.':'비교할 이전 조사가 없어요.')+'</p>')+'</section>';
  return {title:'통합 동향',nav:'siha',html:h};
}

/* ===== 화면: 커뮤니티별 질문 (시하 내부). 4차 통합 동향의 커뮤니티 표, 늘어난 주제, 같이 나온 표현, 산업과 질문 유형을 옮겨 왔어요 ===== */
function viewSihaComm(r){
  var p=r.params, wk=findWeek(p.get('w')||'')||C.latest, wi=wk.i, isLatest=wi===C.latest.i;
  var iv=p.get('ind')||'', ind=has(INDS,iv)?iv:'', span4=p.get('span')==='4', pub=p.get('scope')==='pub', sort=p.get('sort')==='rise'?'rise':'n';
  var inds=ind?[ind]:INDK, lo=span4?Math.max(0,wi-3):wi, hasPrev=!span4&&wi>0;
  var inSpan=function(q){return q.w>=lo&&q.w<=wi;};
  var B=C.Q.filter(function(q){return (!ind||q.ind===ind)&&(!pub||q.review==='public');});
  var cur=B.filter(inSpan), prev=hasPrev?B.filter(function(q){return q.w===wi-1;}):[];
  var nPend=count(C.Q,function(q){return (!ind||q.ind===ind)&&inSpan(q)&&q.review==='pending';});
  var flagAny=hasPrev&&inds.some(function(k){return indFlag(k,wi);});
  var when=span4?'최근 4주':(isLatest?'이번 주':wk.no+'주차'), before=isLatest?'지난주':'그 전주';
  var rowsC=commRows(cur,prev,inds,hasPrev,wi);
  var ov=p.get('open')||'', open=rowsC.some(function(x){return x.s===ov&&x.n>0;})?ov:'';
  var state=function(){return {w:isLatest?'':wk.id,ind:ind,span:span4?'4':'',scope:pub?'pub':'',sort:sort==='rise'?'rise':'',open:open};};
  var href=function(o){var s=state();Object.keys(o).forEach(function(k){s[k]=o[k];});return C.base+'/communities'+qs(s);};
  var per=span4?(isLatest?'r4':''):wk.date;
  var lhref=function(o){var s={ind:ind,rs:pub?'public':'',period:per};Object.keys(o).forEach(function(k){s[k]=o[k];});return listHref(s);};
  rowsC.sort(function(x,y){
    if(sort==='rise'&&hasPrev){var dd=y.d-x.d;if(dd)return dd;}
    return y.n-x.n;
  });
  var live=rowsC.filter(function(x){return x.n>0;}), zero=rowsC.filter(function(x){return x.n===0;});

  /* 머리: 계산한 한 문장, 산업별 건수, 조건 */
  var d=cur.length-prev.length;
  var lead=when+' 새 질문은 '+cur.length+'건이에요.'+(hasPrev?' '+dPhrase(d,before+'('+prev.length+'건)')+'.':(span4?' 4주 합에는 증감을 적지 않아요.':' 비교할 이전 조사가 없어요.'));
  var chips=[];
  if(!isLatest)chips.push('<a class="chip" href="'+href({w:'',open:''})+'" aria-label="조사 주 조건 지우기">조사 주: '+wk.no+'주차'+IC_X+'</a>');
  if(ind)chips.push('<a class="chip" href="'+href({ind:'',open:''})+'" aria-label="산업 조건 지우기">산업: '+esc(INDS[ind].name)+IC_X+'</a>');
  if(span4)chips.push('<a class="chip" href="'+href({span:''})+'" aria-label="기간 조건 지우기">기간: 최근 4주 합'+IC_X+'</a>');
  if(pub)chips.push('<a class="chip" href="'+href({scope:''})+'" aria-label="범위 조건 지우기">범위: 공개된 것만'+IC_X+'</a>');
  var h='<header class="ph"><div><h1>커뮤니티별 질문</h1><p class="sub">조사일 '+(span4&&lo<wi?C.weeks[lo].date+' ~ '+wk.date:wk.date)+'</p></div></header>'+
    '<p class="lead" style="margin-top:0">'+esc(lead)+(flagAny?' '+PMT:'')+'</p>'+
    '<ul class="evs" style="margin-bottom:20px">'+inds.map(function(k){
      var part=false;
      for(var i=lo;i<=wi;i++){if(has(INDS[k].partial,i))part=true;}
      return '<li>'+esc(INDS[k].name)+'<b>'+count(cur,function(q){return q.ind===k;})+'건</b> '+(part?'<span class="tg tg-w">'+(span4?'부분 조사 주 포함':'부분 조사')+'</span>':'<span class="tag">전체 조사</span>')+'</li>';
    }).join('')+'<li class="tag">검수 대기 '+nPend+'건을 '+(pub?'뺐어요.':'포함했어요.')+'</li></ul>';
  h+='<div class="ctl noprint"><div class="f"><label for="sh-w">조사 주</label><select class="sel'+(isLatest?'':' on')+'" id="sh-w" data-go>'+C.weeks.slice().reverse().map(function(w){
      return '<option value="'+href({w:w.i===C.latest.i?'':w.id,open:''})+'"'+(w.i===wi?' selected':'')+'>'+w.no+'주차, 조사일 '+w.date+'</option>';
    }).join('')+'</select></div>'+
    '<div class="f"><label for="sh-i">산업</label><select class="sel'+(ind?' on':'')+'" id="sh-i" data-go><option value="'+href({ind:'',open:''})+'">전체 산업</option>'+INDK.map(function(k){
      return '<option value="'+href({ind:k,open:''})+'"'+(ind===k?' selected':'')+'>'+esc(INDS[k].name)+'</option>';
    }).join('')+'</select></div>'+
    '<div class="f"><label for="sh-s">정렬</label><select class="sel" id="sh-s" data-go><option value="'+href({sort:''})+'"'+(sort==='n'?' selected':'')+'>건수 많은 순</option><option value="'+href({sort:'rise'})+'"'+(sort==='rise'?' selected':'')+'>지난주보다 늘어난 순</option></select></div>'+
    '<details class="fm"'+(span4||pub?' open':'')+'><summary>필터 더 보기'+(span4||pub?' ('+((span4?1:0)+(pub?1:0))+'개 적용)':'')+'</summary><div class="ctl" style="margin:8px 0 0">'+
    '<div class="seg"><span class="lb">기간</span><a href="'+href({span:''})+'"'+(span4?'':CUR)+'>'+(isLatest?'이번 주':wk.no+'주차')+'</a><a href="'+href({span:'4'})+'"'+(span4?CUR:'')+'>최근 4주 합</a></div>'+
    '<div class="seg"><span class="lb">범위</span><a href="'+href({scope:''})+'"'+(pub?'':CUR)+'>검수 대기 포함</a><a href="'+href({scope:'pub'})+'"'+(pub?CUR:'')+'>공개된 것만</a></div></div></details></div>'+
    (chips.length?'<div class="bar noprint" style="margin-bottom:20px">'+chips.join('')+(chips.length>1?'<a class="link" href="'+C.base+'/communities">모두 지우기</a>':'')+'</div>':'');

  /* 커뮤니티 표. 줄을 누르면 그 자리에서 펼쳐져요 */
  var rowHtml=function(x){
    var isOpen=open===x.s, u=href({open:isOpen?'':x.s});
    var t='<tr data-href="'+u+'"'+(isOpen?' class="on"':'')+'><td class="nw"><a class="t" id="sr-'+x.s+'" href="'+u+'" aria-expanded="'+(isOpen?'true':'false')+'">'+esc(SRC[x.s])+'</a><small>주제 '+count(x.tl,function(t2){return t2.g!=='none';})+'개</small></td>'+
      commCells(x,hasPrev,before,3)+'</tr>';
    if(isOpen){
      var nb=count(x.a,function(q){return q.evidence==='body';});
      var s5=C.weeks.map(function(w){return count(B,function(q){return q.src===x.s&&q.w===w.i;});});
      t+='<tr class="ex"><td colspan="4"><div class="exg"><div><h3>주제 전체</h3><ul class="tp">'+x.tl.map(tline).join('')+'</ul>'+
        '<h3>검증 상태 구성</h3><p class="evs"><span>'+ev('body')+'<b>'+nb+'건</b></span><span>'+ev('search')+'<b>'+(x.n-nb)+'건</b></span></p>'+

      ['pos','neg'].forEach(function(kd){
        RK[kd].forEach(function(e){

        });

/* ===== 화면: 브랜드 이슈 (시하 내부) ===== */
var ISORTS=[['recent','최근 글 최신순'],['posts','글 수 많은 순'],['up','최근 24시간에 늘어난 순']];
function viewIssues(r){
  var p=r.params, P=readPeriod(p), g=function(k){return p.get(k)||'';};
  var types=[];
  ITYPE.neg.concat(ITYPE.pos).forEach(function(t){if(!types.some(function(x){return x[0]===t;}))types.push([t,t]);});
  var F=[
    {k:'kind',label:'구분',opts:[['neg','부정'],['pos','긍정']]},
    {k:'brand',label:'브랜드',opts:issueBrands()},
    {k:'ind',label:'산업',opts:INDK.map(function(k){return [k,INDS[k].name];})},
    {k:'rel',label:'고객사 / 경쟁사',opts:[['client','고객사'],['comp','경쟁사']]},
    {k:'type',label:'유형',opts:types},
    {k:'pt',label:'반응 포인트',opts:RPK.map(function(k){return [k,RP[k].name];})},
    {k:'src',label:'커뮤니티',opts:Object.keys(ICOMM).map(function(k){return [k,ICOMM[k]];})},
    {k:'st',label:'확인 상태',opts:[['ok','원문 확인'],['clue','미검증 단서']]}
  ];
  var st={};
  F.forEach(function(x){var v=g(x.k);st[x.k]=optLabel(x,v)?v:'';});
  var sort='recent';
  ISORTS.forEach(function(o){if(o[0]===g('sort'))sort=o[0];});
  var href=function(o){
    var s=pq(P);
    F.forEach(function(x){s[x.k]=st[x.k];});
    s.sort=sort==='recent'?'':sort;
    Object.keys(o).forEach(function(k){s[k]=o[k];});
    return C.base+'/issues'+qs(s);
  };
  var fx=function(x){
    return (!st.kind||x.kind===st.kind)&&(!st.brand||x.brand===st.brand)&&(!st.rel||(st.rel==='client')===x.isClient)&&(!st.ind||x.ind===st.ind)&&(!st.type||x.type===st.type)&&(!st.pt||x.pts.indexOf(st.pt)>=0);
  };
  var rows=ISSUES.filter(fx).map(function(x){
    var s=istat(x,P.win,st.src);
    return {x:x,ok:s.ok,clue:s.clue,comms:s.comms.length,c24:istat(x,W24,st.src).ok,last:s.last};
  }).filter(function(e){return st.st==='ok'?e.ok>0:(st.st==='clue'?e.clue>0:(e.ok+e.clue>0));});
  rows.sort(function(a,b){
    if(sort==='posts')return b.ok-a.ok||b.c24-a.c24;
    if(sort==='up')return b.c24-a.c24||b.ok-a.ok;
    var la=a.last||'', lb=b.last||'';
    return la<lb?1:la>lb?-1:b.ok-a.ok;
  });
  /* 계산한 한 문장. 아래 표와 같은 줄에서 세요 */
  var T={neg:{i:0,n:0},pos:{i:0,n:0},clue:0,only:0};
  rows.forEach(function(e){
    T.clue+=e.clue;
    if(e.ok){T[e.x.kind].i++;T[e.x.kind].n+=e.ok;}else T.only++;
  });
  var lead=P.err?'기간을 다시 골라 주세요.':P.span+' 동안 원문을 확인한 이슈는 부정 '+T.neg.i+'건(글 '+T.neg.n+'건), 긍정 '+T.pos.i+'건(글 '+T.pos.n+'건)이에요. 미검증 단서는 '+T.clue+'건이에요.'+
    (T.only?' 단서만 있는 이슈 '+T.only+'건은 이슈 수에 넣지 않았어요.':'');
  var chips=goChips(F,st,href,C.base+'/issues'+qs((function(){var s=pq(P);s.sort=sort==='recent'?'':sort;return s;})()));
  var h='<header class="ph"><div><h1>브랜드 이슈</h1><p class="sub">이슈 아카이브: '+RUND0+'부터 쌓였어요. 평일 09:00에 실행하고 직전 24시간을 봐요.</p></div></header>'+
    periodBar(P,href)+
    '<p class="lead" style="margin-top:20px">'+esc(lead)+'</p>'+
    goFilters(F,st,href,3)+
    '<div class="bar2"><div class="l"><p class="count" role="status"><b>'+rows.length+'</b>건 / 전체 이슈 '+ISSUES.length+'건</p><span class="l noprint">'+chips+'</span></div>'+
    '<div class="r noprint"><select class="sel" id="if-sort" data-go aria-label="정렬">'+ISORTS.map(function(o){return '<option value="'+href({sort:o[0]==='recent'?'':o[0]})+'"'+(sort===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select></div></div>';
  h+=rows.length?'<table class="tbl go"><thead><tr><th scope="col">구분</th><th scope="col">브랜드와 유형</th><th scope="col">요약</th><th scope="col">글 수와 커뮤니티 수</th><th scope="col">최근 글 게시</th></tr></thead><tbody>'+
    rows.map(function(e){
      var x=e.x, u=C.base+'/issues/'+x.id;
      return '<tr data-href="'+u+'"><td class="nw">'+kdTag(x.kind)+'</td><td class="nw">'+brandTag(x)+'<small>'+esc(x.type)+'</small></td>'+
        '<td><a class="t" href="'+u+'">'+esc(x.summary)+'</a><small>'+(x.pts.length?'반응 포인트: '+x.pts.map(function(k){return esc(RP[k].name);}).join(', ')+'. ':'')+'처음 확인 '+x.first.slice(0,10)+'</small></td>'+
        '<td class="nw" data-l="글">글 '+e.ok+'건, 커뮤니티 '+e.comms+'곳<small>미검증 단서 '+e.clue+'건'+(e.c24?', 최근 24시간에 '+e.c24+'건':'')+'</small></td>'+
        '<td class="nw s" data-l="최근 글 게시">'+(e.last||'<span class="unknown">확인한 글 없음</span>')+'</td></tr>';
    }).join('')+'</tbody></table><p class="note">글 수와 커뮤니티 수, 최근 글은 고른 기간('+esc(P.label)+')의 원문 확인 글 기준이에요.</p><p class="note">'+NOTE_KIND+'</p>'
    :'<div class="empty"><h2>'+(P.err?'기간을 다시 골라 주세요':'조건에 맞는 이슈가 없어요')+'</h2><p>'+(P.err?(P.out?'이슈 아카이브는 '+RUND0+'부터 쌓였어요.':'시작일은 종료일보다 앞이어야 해요.'):'필터를 줄이거나 기간을 넓혀 주세요.')+'</p><a class="btn" href="'+C.base+'/issues">필터 모두 지우기</a></div>';
  /* 추이 */
  if(P.bucket!=='none'&&rows.length)h+='<section class="sec"><h2>추이</h2>'+trendBlock(P,fx,1080)+'<p class="note">구분, 브랜드, 산업, 유형, 반응 포인트 조건을 따라요. 커뮤니티와 확인 상태 조건은 따르지 않아요.</p></section>';
  /* 브랜드별 */
  var bl=[];
  ISSUES.forEach(function(x){
    if(st.ind&&x.ind!==st.ind)return;
    var e=null;
    bl.forEach(function(b){if(b.brand===x.brand)e=b;});
    if(!e){e={brand:x.brand,x:x,neg:0,pos:0,ok:0};bl.push(e);}
    var n=istat(x,P.win).ok;
    if(n){e[x.kind]++;e.ok+=n;}
  });
  bl=bl.filter(function(b){return b.ok>0;}).sort(function(a,b){return b.ok-a.ok;});
  h+='<section class="sec"><h2>브랜드별</h2>'+(bl.length?
    '<p class="lead">'+esc('글이 가장 많은 브랜드는 '+bl[0].x.brandName+ie(bl[0].x.brandName)+'(부정 이슈 '+bl[0].neg+'건, 긍정 이슈 '+bl[0].pos+'건, 글 '+bl[0].ok+'건).')+'</p>'+
    '<table class="tbl"><thead><tr><th scope="col">브랜드</th><th scope="col">산업</th><th scope="col" class="n">부정 이슈</th><th scope="col" class="n">긍정 이슈</th><th scope="col" class="n">원문 확인 글</th></tr></thead><tbody>'+
    bl.map(function(b){return '<tr><td><a class="t" href="'+href({brand:b.brand})+'">'+brandTag(b.x)+'</a></td><td class="nw s">'+esc(INDS[b.x.ind].name)+'</td><td class="n" data-l="부정 이슈">'+b.neg+'건</td><td class="n" data-l="긍정 이슈">'+b.pos+'건</td><td class="n" data-l="원문 확인 글"><b>'+b.ok+'건</b></td></tr>';}).join('')+
    '</tbody></table><p class="note">고른 기간의 값이에요. 산업 조건만 따라요.</p>'
    :'<p class="lead">'+(P.err?'기간을 다시 골라 주세요.':'이 기간에는 원문을 확인한 글이 없어요.')+'</p>')+'</section>';
  /* 커뮤니티별 확인 범위 */
  var lim=limitedNames();
  h+='<section class="sec"><h2>커뮤니티별 확인 범위</h2><p class="lead">'+esc('최근 실행('+REF+')에서 확인 제한이 걸린 커뮤니티는 '+lim.length+'곳이에요'+(lim.length?'('+lim.join(', ')+')':'')+'.')+'</p>'+
    '<table class="tbl"><thead><tr><th scope="col">커뮤니티</th><th scope="col">확인 범위</th><th scope="col">최근 실행 결과</th><th scope="col">한계</th></tr></thead><tbody>'+
    Object.keys(ICOMM).map(function(k){
      var cv=COVER[k], ok=0, clue=0;
      ISSUES.forEach(function(x){var s=istat(x,W24,k);ok+=s.ok;clue+=s.clue;});
      return '<tr><td class="nw"><b>'+esc(ICOMM[k])+'</b></td><td class="nw">'+(cv.st==='ok'?'확인':'<span class="tg tg-w">'+COVERN[cv.st]+'</span>')+'</td>'+
        '<td class="nw" data-l="결과">'+(ok?'원문 확인 글 '+ok+'건':(cv.fail?'<span class="tg tg-w">검색 실패</span>':'<span class="unknown">발견 없음</span>'))+'<small>미검증 단서 '+clue+'건</small></td><td class="s">'+esc(cv.note)+'</td></tr>';
    }).join('')+'</tbody></table><p class="note">발견 없음은 검색했지만 글이 없었다는 뜻이고, 검색 실패는 검색 자체를 하지 못했다는 뜻이에요.</p></section>';
  return {title:'브랜드 이슈',nav:'issues',html:h,foot:FOOT_ISSUE};
}

/* ===== 화면: 이슈 상세 (시하 내부) ===== */
function viewIssue(id){

  var cmax=Math.max.apply(null,byC.map(function(e){return e.n;}).concat([1]));

  var days=Math.max(1,Math.round((toMs(hi)-toMs(lo))/86400000));
  var TP={lo:lo,hi:hi,win:{lo:lo,hi:hi},days:days,bucket:days<=31?'day':(days<=120?'week':'month')};
  var bk=buckets(TP), ser=series(TP,bk,function(y){return y===x;});
  var only=x.pts.length?x.pts.map(function(k){return esc(RP[k].name);}).join(', '):'';

    '<div class="dgrid"><div>'+

    '<section><h2>커뮤니티별 글 수</h2>'+(byC.length?'<ul class="hb">'+byC.map(function(e){

    }).join('')+'</ul><p class="note">원문 확인 글만 세요.</p>':'<div class="empty sm"><p>원문을 확인한 글이 없어요.</p></div>')+'</section>'+
    '<section><h2>원문 확인 글 '+oks.length+'건</h2>'+(oks.length?'<ul class="ls row">'+oks.map(function(q){return postLi(q,null);}).join('')+'</ul>'+
      '<p class="note">대표 글에만 요약을 두었어요. 나머지는 게시 시각, 커뮤니티, 확인 상태만 남겼어요.</p>':'<div class="empty sm"><p>원문을 확인한 글이 없어요.</p></div>')+'</section>'+

    '</div><aside aria-label="이슈 정보"><dl class="meta">'+

/* ===== 6차: 알림, 대화 상자, 옆 창 ===== */
var TOAST_UNDO=null, focusId=null, toastKeep=false;
function setToast(msg,undo){
  TOAST_UNDO=undo||null;
  document.getElementById('toast').innerHTML=msg?'<span>'+esc(msg)+'</span>'+(undo?'<button class="btn" type="button" id="toast-undo">되돌리기</button>':''):'';
}
document.getElementById('toast').addEventListener('click',function(e){
  if(e.target.id==='toast-undo'&&TOAST_UNDO){var f=TOAST_UNDO;TOAST_UNDO=null;f();}
});
function go(h){if(location.hash===h)render();else location.hash=h;}
function homeHash(){return isSiha()?'#/admin':'#/c/'+(has(CLIENTS,CL)?CL:DEFAULT);}
var MODAL=null;
var FOCUSABLE='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
/* o: {kind:'dlg'|'drw', html, opener, focus(처음 포커스를 받을 선택자), bind(상자 요소)}. 닫으면 연 버튼으로 포커스가 돌아가요 */
function openModal(o){
  closeModal(true);
  var bg=document.createElement('div'), opener=o.opener||document.activeElement;
  bg.className='mbg'+(o.kind==='drw'?' right':'');
  bg.innerHTML='<div class="'+o.kind+'" role="dialog" aria-modal="true" aria-labelledby="md-t">'+o.html+'</div>';
  document.body.appendChild(bg);
  MODAL={bg:bg,opener:opener,openerId:opener&&opener.id?opener.id:''};
  document.querySelector('.shell').setAttribute('inert','');
  bg.addEventListener('mousedown',function(e){if(e.target===bg)closeModal();});
  bg.addEventListener('keydown',function(e){
    if(e.key==='Escape'){e.preventDefault();closeModal();return;}
    if(e.key==='Tab'){
      var f=bg.querySelectorAll(FOCUSABLE);
      if(!f.length)return;
      if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f[f.length-1].focus();}
      else if(!e.shiftKey&&document.activeElement===f[f.length-1]){e.preventDefault();f[0].focus();}
    }
  });

/* ===== 화면: 검수 (관리자) =====
   하루 100건을 건당 20초에 보는 화면이에요. 한 줄에 한 건, 훑고 바로 누르게 만들었어요 */
var RV={cur:null,sel:{},rej:null};
function rvFilters(p){
  var ind=p.get('ind')||'', pg=p.get('pg')||'', ev=p.get('ev')||'';
  if(!has(INDS,ind))ind='';
  if(!has(PGN,pg)||(ind&&PGI[pg]!==ind))pg='';
  if(ev!=='body'&&ev!=='search')ev='';
  return {ind:ind,pg:pg,ev:ev};
}
function rvRows(){return Array.prototype.slice.call(document.querySelectorAll('#view li.rv'));}
function rvChecked(){return Array.prototype.map.call(document.querySelectorAll('#view .ckb:checked'),function(c){return c.getAttribute('data-id');});}
function rvNextId(id){
  var rows=rvRows();
  for(var i=0;i<rows.length;i++){
    if(rows[i].getAttribute('data-id')===id){var n=rows[i+1]||rows[i-1];return n?n.getAttribute('data-id'):null;}
  }
  return null;
}
function rvUpdateBulk(){
  var n=rvChecked().length, rows=document.querySelectorAll('#view .ckb').length;
  var s=document.getElementById('rv-sel'), a=document.getElementById('rv-all'), bp=document.getElementById('rv-bpub'), br=document.getElementById('rv-brej');
  if(!s)return;
  s.textContent=n?'선택한 질문 '+n+'건':'선택한 질문이 없어요';
  bp.textContent='선택한 '+n+'건 공개';br.textContent='선택한 '+n+'건 반려';
  bp.disabled=!n;br.disabled=!n;
  a.checked=rows>0&&n===rows;
}
/* 공개(pub), 반려(rej), 대기로 되돌리기(back). 처리하면 알림 한 줄과 되돌리기 버튼이 나와요 */
function rvApply(kind,ids,reason){
  var nxt=ids.length===1?rvNextId(ids[0]):null, to=kind==='pub'?'public':(kind==='rej'?'rejected':'pending');
  var snaps=setReview(ids,to,reason), names=seenNames(ids), tgt=idLabel(ids), msg;
  if(kind==='pub'){
    audit('공개',tgt,names.length?'보이는 고객사 '+names.join(', '):'구독한 고객사 없음');
    msg=(ids.length>1?ids.length+'건을 공개했어요. ':'공개했어요. ')+(names.length?names.join(', ')+' 화면에 보여요.':'구독한 고객사가 없어서 아직 보이는 화면이 없어요.');
  }else if(kind==='rej'){
    audit('반려',tgt,'사유 '+reason);
    msg=(ids.length>1?ids.length+'건을 반려했어요':'반려했어요')+'(사유: '+reason+').';
  }else{
    audit('되돌리기',tgt,'대기로 되돌림');
    msg=(ids.length>1?ids.length+'건을 ':'')+'대기로 되돌렸어요.';
  }
  ids.forEach(function(id){delete RV.sel[id];});
  RV.rej=null;RV.cur=nxt;focusId=nxt?'rv-'+nxt:'rv-h';
  setToast(msg,function(){
    restoreSnaps(snaps);
    audit('되돌리기',tgt,'방금 처리를 취소');
    setToast('되돌렸어요. 처리하기 전 상태로 돌아갔어요.');
    RV.cur=null;focusId='rv-h';
    render();
  });
  render();
}
function rvRejForm(id){

function openEdit(id,opener){

    '<div class="fld"><label for="ed-sc">공개 범위</label><select class="sel" id="ed-sc"><option value="">제품군을 구독한 고객사 모두</option>'+cls.map(function(k){return '<option value="'+k+'"'+(q.brand===k?' selected':'')+'>이 고객사에만: '+esc(CLIENTS[k].name)+'</option>';}).join('')+'</select></div>'+
    '<div class="acts"><button class="btn" type="submit">저장</button>'+(q.review!=='public'?'<button class="btn btn-p" type="button" id="ed-pub">저장하고 공개</button>':'')+'<button class="btn" type="button" id="ed-close">닫기</button></div></form>';

function viewReview(r){
  var p=r.params, f=rvFilters(p), st=p.get('st');
  st=(st==='public'||st==='rejected')?st:'pending';
  var lim=parseInt(p.get('lim'),10);
  if(!(lim>0))lim=50;
  var href=function(o){var s={st:st==='pending'?'':st,ind:f.ind,pg:f.pg,ev:f.ev,lim:''};Object.keys(o).forEach(function(k){s[k]=o[k];});return '#/admin/review'+qs(s);};
  var base=ALLQ.filter(function(q){return (!f.ind||q.ind===f.ind)&&(!f.pg||q.pg===f.pg)&&(!f.ev||q.evidence===f.ev);});
  var n={pending:0,public:0,rejected:0};
  base.forEach(function(q){n[q.review]++;});
  var all=base.filter(function(q){return q.review===st;}).sort(function(a,b){return a.day<b.day?1:(a.day>b.day?-1:(a.id<b.id?-1:1));});
  var list=all.slice(0,lim), lastDay=QDAYS[QDAYS.length-1], pendAll=pendingCount();

  var STL={pending:'대기',public:'공개',rejected:'반려'};
  var parts=[STL[st]];
  if(f.ind)parts.push(INDS[f.ind].name);
  if(f.pg)parts.push(PGN[f.pg]);
  if(f.ev)parts.push(f.ev==='body'?'본문 확인만':'검색 근거(본문 미확인)만');
  var h='<header class="ph"><div><h1 id="rv-h" tabindex="-1">검수</h1><p class="sub">'+esc(sub)+'</p></div></header>'+
    '<div class="seg noprint" role="group" aria-label="검수 상태"><span class="lb">상태</span>'+
    [['pending','대기'],['public','공개'],['rejected','반려']].map(function(o){return '<a href="'+href({st:o[0]==='pending'?'':o[0]})+'"'+(st===o[0]?CUR:'')+'>'+o[1]+'<small>'+n[o[0]]+'건</small></a>';}).join('')+'</div>'+
    '<div class="ctl noprint" style="margin-top:16px">'+
    '<div class="f"><label for="rf-ind">산업</label><select class="sel'+(f.ind?' on':'')+'" id="rf-ind" data-go><option value="'+href({ind:'',pg:''})+'">전체 산업</option>'+INDK.map(function(k){return '<option value="'+href({ind:k,pg:''})+'"'+(f.ind===k?' selected':'')+'>'+esc(INDS[k].name)+'</option>';}).join('')+'</select></div>'+
    '<div class="f"><label for="rf-pg">제품군</label><select class="sel'+(f.pg?' on':'')+'" id="rf-pg" data-go><option value="'+href({pg:''})+'">전체 제품군</option>'+Object.keys(PGN).filter(function(k){return !f.ind||PGI[k]===f.ind;}).map(function(k){return '<option value="'+href({pg:k})+'"'+(f.pg===k?' selected':'')+'>'+esc(PGN[k])+'</option>';}).join('')+'</select></div>'+
    '<div class="f"><label for="rf-ev">검증 상태</label><select class="sel'+(f.ev?' on':'')+'" id="rf-ev" data-go><option value="'+href({ev:''})+'">전체</option><option value="'+href({ev:'body'})+'"'+(f.ev==='body'?' selected':'')+'>'+EV.body+'</option><option value="'+href({ev:'search'})+'"'+(f.ev==='search'?' selected':'')+'>'+EV.search+'</option></select></div></div>'+
    '<p class="lead" style="margin:0 0 6px" role="status">'+esc(parts.join(', '))+'. '+all.length+'건</p>'+
    '<p class="note noprint" style="margin:0 0 16px">키보드: J와 K로 줄을 옮기고, P는 공개, R은 반려, E는 수정이에요. 입력 칸에서는 쓰이지 않아요.</p><div id="rv-main">';
  if(!list.length){

    else if(f.ind||f.pg||f.ev)h+='<div class="empty"><h2>조건에 맞는 질문이 없어요</h2><p>조건을 줄이면 더 보여요.</p><a class="btn" href="'+href({ind:'',pg:'',ev:''})+'">조건 모두 지우기</a></div>';
    else h+='<div class="empty"><h2>이 상태의 질문이 없어요</h2><p>다른 상태 탭을 눌러 보세요.</p></div>';
  }else{

      '<button class="btn btn-p" type="button" id="rv-bpub" data-act="bpub" disabled>선택한 0건 공개</button><button class="btn" type="button" id="rv-brej" data-act="brej" disabled>선택한 0건 반려</button>'+(RV.rej==='bulk'?rvRejForm('bulk'):'')+'</div>';
    h+='<ol class="rvl'+(st==='pending'?'':' top')+'">'+list.map(function(q){return rvRow(q,st);}).join('')+'</ol>';
    if(all.length>list.length)h+='<p style="margin-top:16px"><a class="btn" href="'+href({lim:String(lim+50)})+'">'+Math.min(50,all.length-list.length)+'건 더 보기(남은 '+(all.length-list.length)+'건)</a></p>';
  }

  /* 최근 처리 기록 */
  h+='<section class="sec"><h2>최근 처리 기록</h2><table class="tbl"><thead><tr><th scope="col">시각</th><th scope="col">처리한 사람</th><th scope="col">처리</th><th scope="col">대상과 내용</th></tr></thead><tbody>'+
    AUDIT.slice(0,10).map(function(a){return '<tr><td class="nw s">'+a.at+'</td><td class="nw" data-l="처리한 사람">'+esc(a.who)+'</td><td class="nw" data-l="처리">'+esc(a.action)+'</td><td data-l="대상">'+esc(a.target)+(a.detail?'<small>'+esc(a.detail)+'</small>':'')+'</td></tr>';}).join('')+'</tbody></table></section>';
  return {title:'검수',nav:'review',html:h,init:function(){
    var main=document.getElementById('rv-main');

      else if(act==='rejno'){var o=RV.rej;RV.rej=null;focusId=o==='bulk'?'rv-brej':'rb-'+o;render();}

/* J, K로 줄 이동, P 공개, R 반려, E 수정. 입력 칸과 대화 상자 안에서는 쓰지 않아요 */
document.addEventListener('keydown',function(e){
  if(MODAL||e.ctrlKey||e.metaKey||e.altKey||location.hash.indexOf('#/admin/review')!==0)return;
  var t=e.target, tn=t&&t.tagName;
  if(tn==='TEXTAREA'||tn==='SELECT'||(tn==='INPUT'&&t.type!=='checkbox')||(t&&t.isContentEditable))return;
  var k=(e.key||'').toLowerCase();
  if(k!=='j'&&k!=='k'&&k!=='p'&&k!=='r'&&k!=='e')return;
  var rows=rvRows();
  if(!rows.length)return;
  var li=t&&t.closest?t.closest('li.rv'):null, id=li?li.getAttribute('data-id'):RV.cur, idx=-1;
  rows.forEach(function(x,i){if(x.getAttribute('data-id')===id)idx=i;});
  if(k==='j'||k==='k'){
    e.preventDefault();
    var ni=idx<0?0:Math.max(0,Math.min(rows.length-1,idx+(k==='j'?1:-1)));
    rows[ni].focus();RV.cur=rows[ni].getAttribute('data-id');
    return;
  }
  if(idx<0)return;
  var q=qById(id);
  if(k==='p'&&q.review==='pending'){e.preventDefault();rvApply('pub',[id]);}
  else if(k==='r'&&q.review==='pending'){e.preventDefault();RV.cur=id;RV.rej=id;focusId='rj-'+id;render();}
  else if(k==='e'){e.preventDefault();openEdit(id,document.getElementById('ed-'+id));}
});

/* ===== 화면: 실행 기록 (관리자) ===== */
function viewRuns(r){
  var p=r.params, ind=p.get('ind')||'', res=p.get('res')||'', day=p.get('day')||'';
  if(!has(INDS,ind))ind='';
  if(!has(RES,res))res='';
  if(QDAYS.indexOf(day)<0)day='';

  if(!(lim>0))lim=30;
  var href=function(o){var s={ind:ind,res:res,day:day,lim:''};Object.keys(o).forEach(function(k){s[k]=o[k];});return '#/admin/runs'+qs(s);};
  var lastDay=QDAYS[QDAYS.length-1], latest=QRUNS.filter(function(x){return x.date===lastDay;});
  var missDays=QDAYS.filter(function(d){return dayStat(d)==='missed';}), fails=QRUNS.filter(function(x){return x.status==='failed';});
  var streak=0;
  for(var i=QDAYS.length-1;i>=0;i--){var s=dayStat(QDAYS[i]);if(s==='missed'||s==='failed')break;streak++;}

  if(missDays.length||fails.length){
    h+='<div class="abox"><h3>빠진 실행과 실패</h3><ul>'+missDays.map(function(d){return '<li>'+d+' 07:00 실행이 모든 산업에서 빠졌어요.</li>';}).join('')+
      fails.map(function(x){return '<li>'+x.date+' '+x.time+' '+esc(INDS[x.ind].name)+' 실행이 실패했어요(오류 코드 '+esc(x.errorCode)+').</li>';}).join('')+'</ul></div>';
  }
  h+='<section class="sec"><h2>최근 28일</h2><ol class="dstrip" aria-label="최근 28일 실행 결과. 칸을 누르면 아래 표가 그 날로 걸러져요">'+QDAYS.map(function(d){
    var s=ind?runStatus(ind,d):dayStat(d), on=day===d;
    return '<li><a class="dc dc-'+s+'" href="'+href({day:on?'':d})+'"'+(on?CUR:'')+' aria-label="'+d+', '+RES[s]+(on?', 선택됨. 누르면 해제돼요':'')+'">'+d.slice(5).replace('-','/')+'<b>'+RSHORT[s]+'</b></a></li>';
  }).join('')+'</ol><p class="note">한 칸이 하루예요. '+(ind?'칸은 '+esc(INDS[ind].name)+' 실행 결과예요.':'하루 결과는 세 산업 중 가장 나쁜 결과예요.')+' 테두리는 실선이 완료, 파선이 부분, 겹선이 실패, 점선이 빠짐이에요.</p></section>'+
    '<section class="sec"><h2>실행 목록</h2><div class="ctl noprint" style="margin-top:12px"><div class="f"><label for="ru-ind">산업</label><select class="sel'+(ind?' on':'')+'" id="ru-ind" data-go><option value="'+href({ind:''})+'">전체 산업</option>'+
    INDK.map(function(k){return '<option value="'+href({ind:k})+'"'+(ind===k?' selected':'')+'>'+esc(INDS[k].name)+'</option>';}).join('')+'</select></div>'+
    '<div class="f"><label for="ru-res">결과</label><select class="sel'+(res?' on':'')+'" id="ru-res" data-go><option value="'+href({res:''})+'">전체 결과</option>'+
    Object.keys(RES).map(function(k){return '<option value="'+href({res:k})+'"'+(res===k?' selected':'')+'>'+RES[k]+'</option>';}).join('')+'</select></div>'+
    (day?'<a class="chip" href="'+href({day:''})+'" aria-label="'+day+' 필터 지우기">'+day+IC_X+'</a>':'')+'</div>'+
    '<p class="count" role="status"><b>'+rows.length+'</b>건 / 전체 '+QRUNS.length+'건</p>';
  if(!rows.length)h+='<div class="empty"><h2>조건에 맞는 실행이 없어요</h2><p>조건을 줄여 보세요.</p><a class="btn" href="#/admin/runs">조건 모두 지우기</a></div>';
  else{
    h+='<table class="tbl"><thead><tr><th scope="col">실행 일시</th><th scope="col">산업</th><th scope="col">결과</th><th scope="col">조사량</th><th scope="col">후보와 저장</th><th scope="col">모델과 지시문</th></tr></thead><tbody>'+
      rows.slice(0,lim).map(function(x){
        var dash='-';
        return '<tr><td class="nw">'+x.date+(x.time?' '+x.time:'')+(x.status==='missed'?'<small>실행되지 않았어요</small>':'')+'</td><td class="nw" data-l="산업">'+esc(INDS[x.ind].name)+'</td>'+
          '<td data-l="결과">'+(x.status==='ok'?'완료':'<span class="tg tg-w">'+RES[x.status]+'</span>')+(x.errorCode?'<small>오류 코드 '+esc(x.errorCode)+'</small>':'')+'</td>'+
          '<td data-l="조사량">'+(x.searches===null?dash:'검색 '+x.searches+'회, 모델 호출 '+x.modelCalls+'회<small>읽은 페이지 '+x.pagesRead+'쪽, 못 읽은 페이지 '+x.pagesFailed+'쪽</small>')+'</td>'+
          '<td class="nw" data-l="후보와 저장">'+(x.candidates===null?dash:'후보 '+x.candidates+'건<small>저장 '+x.kept+'건</small>')+'</td>'+
          '<td data-l="모델과 지시문">'+(x.model?esc(x.model)+', 지시문 '+x.promptVer+'<small>거르기 기준 '+x.filterVer+'</small>':dash)+(firstV4[x.ind]===x?'<small><span class="tg">이 실행부터 지시문 v4</span></small>':'')+'</td></tr>';
      }).join('')+'</tbody></table>';
    if(rows.length>lim)h+='<p style="margin-top:16px"><a class="btn" href="'+href({lim:String(lim+30)})+'">'+Math.min(30,rows.length-lim)+'건 더 보기(남은 '+(rows.length-lim)+'건)</a></p>';
  }
  h+='<p class="note">저장 건수는 그날 조사일이 찍힌 질문 수예요. 빠진 날과 실패한 날에는 새 질문이 없어요.</p></section>';
  return {title:'실행 기록',nav:'runs',html:h};
}

/* ===== 계정 표, 초대 폼: 관리자 계정 화면과 고객사 계정 관리가 같이 써요 ===== */
function userTable(list,o){
  var me=meUser().id;
  return '<table class="tbl"><thead><tr><th scope="col">이름과 이메일</th><th scope="col">'+(o.site?'소속과 역할':'역할')+'</th><th scope="col">상태</th><th scope="col">초대한 사람</th>'+(o.edit?'<th scope="col">바꾸기</th>':'')+'</tr></thead><tbody>'+
    list.map(function(u){
      var self=u.id===me, fam=u.role.indexOf('siha')===0?['siha_admin','siha_editor']:['client_admin','client_viewer'];
      var rc=o.edit&&!self?'<select class="sel" id="ur-'+u.id+'" data-uact="role" data-id="'+u.id+'" aria-label="'+esc(u.name)+' 역할 바꾸기">'+fam.map(function(x){return '<option value="'+x+'"'+(x===u.role?' selected':'')+'>'+ROLEN[x]+'</option>';}).join('')+'</select>':ROLEN[u.role];
      var stc=u.status==='active'?'사용 중':'<span class="tg tg-w">'+STN[u.status]+'</span>';
      var nm=esc(u.name), act='';
      if(o.edit){
        if(u.status==='invited')act+='<button class="btn" type="button" id="ub-resend-'+u.id+'" data-uact="resend" data-id="'+u.id+'" aria-label="초대 다시 보내기: '+nm+'">초대 다시 보내기</button> ';
        if(u.status==='suspended')act+='<button class="btn" type="button" id="ub-resume-'+u.id+'" data-uact="resume" data-id="'+u.id+'" aria-label="다시 사용: '+nm+'">다시 사용</button>';
        else if(self)act+='<span class="unknown">내 계정은 중지할 수 없어요</span>';
        else act+='<button class="btn" type="button" id="ub-suspend-'+u.id+'" data-uact="suspend" data-id="'+u.id+'" aria-label="사용 중지: '+nm+'">사용 중지</button>';
      }
      return '<tr><td><b>'+nm+'</b>'+(self?' <span class="tg">내 계정</span>':'')+'<small>'+esc(u.email)+'</small></td>'+
        '<td data-l="'+(o.site?'소속과 역할':'역할')+'">'+(o.site?esc(u.client?CLIENTS[u.client].name:'시하')+'<small>'+rc+'</small>':rc)+'</td>'+
        '<td data-l="상태">'+stc+'<small>'+(u.lastLogin?'마지막 로그인 '+u.lastLogin:'아직 로그인한 적 없어요')+'</small></td>'+
        '<td class="s" data-l="초대한 사람">'+esc(u.invitedBy||'-')+'</td>'+(o.edit?'<td>'+act+'</td>':'')+'</tr>';
    }).join('')+'</tbody></table>';
}
function userAct(act,id,val){
  var u=null;
  USERS.forEach(function(x){if(x.id===id)u=x;});
  if(!u)return;
  var cn=u.client?CLIENTS[u.client].name:'시하', old={role:u.role,status:u.status}, msg, fid;
  if(act==='role'){
    u.role=val;
    audit('역할 변경',u.email,ROLEN[old.role]+'에서 '+ROLEN[val]+'로 바꿈');
    msg='역할을 바꿨어요. '+u.name+': '+ROLEN[val]+'.';fid='ur-'+id;
  }else if(act==='suspend'){
    if(u.id===meUser().id)return;
    u.status='suspended';
    audit('정지',u.email,cn+' 계정을 사용 중지로 바꿈');
    msg='사용 중지했어요. '+u.name+' 계정은 더 이상 로그인할 수 없어요.';fid='ub-resume-'+id;
  }else if(act==='resume'){
    u.status=u.lastLogin?'active':'invited';
    audit('다시 사용',u.email,cn+' 계정을 다시 사용으로 바꿈');
    msg='다시 사용하도록 바꿨어요. '+u.name+' 계정은 '+STN[u.status]+' 상태예요.';fid='ub-suspend-'+id;
  }else if(act==='resend'){
    audit('초대 다시 보내기',u.email,cn);
    setToast('초대 메일을 다시 보냈어요. 받는 곳은 '+u.email+'이에요.');
    focusId='ub-resend-'+id;render();return;
  }else return;
  focusId=fid;
  setToast(msg,function(){
    u.role=old.role;u.status=old.status;
    audit('되돌리기',u.email,'방금 처리를 취소');
    setToast('되돌렸어요. 처리하기 전 상태로 돌아갔어요.');
    focusId=act==='role'?'ur-'+id:'ub-'+(act==='suspend'?'suspend':'resume')+'-'+id;
    render();
  });
  render();
}
function bindUserActs(root){
  root.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('button[data-uact]');
    if(b)userAct(b.getAttribute('data-uact'),b.getAttribute('data-id'));
  });
  root.addEventListener('change',function(e){
    var t=e.target;
    if(t&&t.getAttribute&&t.tagName==='SELECT'&&t.getAttribute('data-uact')==='role')userAct('role',t.getAttribute('data-id'),t.value);
  });
}
/* 초대 폼. o: {roles:[...], clients:[...] 고르게 할 고객사, fixed:고객사 ID(고정)} */

    '<div class="fld"><label for="iv-email">이메일</label><input class="inp" id="iv-email" type="email" autocomplete="off" placeholder="예: name@example.com"><p class="err" id="iv-email-e" hidden></p></div>'+
    '<div class="fld"><label for="iv-name">이름</label><input class="inp" id="iv-name" type="text" autocomplete="off"><p class="err" id="iv-name-e" hidden></p></div>'+
    '<div class="fld"><label for="iv-role">역할</label><select class="sel" id="iv-role">'+o.roles.map(function(k){return '<option value="'+k+'">'+ROLEN[k]+'</option>';}).join('')+'</select></div>'+

    '</div><div class="acts"><button class="btn btn-p" type="submit">초대 메일 보내기</button></div></form>';
}
function bindInvite(o){
  var form=document.getElementById('iv-form');
  if(!form)return;
  var role=document.getElementById('iv-role'), cl=document.getElementById('iv-cl');
  var sync=function(){
    if(!cl)return;
    var isC=role.value.indexOf('client')===0;
    cl.disabled=!isC;
    if(!isC)cl.value='';
    else if(!cl.value&&o.defaultClient)cl.value=o.defaultClient;
  };
  role.addEventListener('change',sync);
  sync();
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var em=document.getElementById('iv-email').value.trim(), nm=document.getElementById('iv-name').value.trim(), rl=role.value, cid=o.fixed||(cl?cl.value:''), bad='';
    showErr('iv-email-e','','iv-email');showErr('iv-name-e','','iv-name');if(cl)showErr('iv-cl-e','','iv-cl');
    if(!em){showErr('iv-email-e','이메일을 적어 주세요. 예: name@example.com','iv-email');bad='iv-email';}
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){showErr('iv-email-e','이메일 형식이 맞지 않아요. name@example.com처럼 @와 점이 들어가게 적어 주세요.','iv-email');bad='iv-email';}
    else if(USERS.some(function(u){return u.email.toLowerCase()===em.toLowerCase();})){showErr('iv-email-e','이미 있는 이메일이에요. 목록에서 그 계정을 찾아 역할이나 상태를 바꿔 주세요.','iv-email');bad='iv-email';}
    if(!nm){showErr('iv-name-e','이름을 적어 주세요.','iv-name');if(!bad)bad='iv-name';}
    if(rl.indexOf('client')===0&&!cid){showErr('iv-cl-e','소속 고객사를 골라 주세요. 고객사 역할은 소속이 있어야 해요.','iv-cl');if(!bad)bad='iv-cl';}
    if(bad){document.getElementById(bad).focus();return;}
    var me=meUser();
    USERS.push({id:'U-'+(++USEQ),name:nm,email:em,role:rl,client:rl.indexOf('client')===0?cid:'',status:'invited',lastLogin:'',invitedBy:me.name});
    audit('초대',em,ROLEN[rl]+(cid&&rl.indexOf('client')===0?', '+CLIENTS[cid].name:''));
    setToast('초대 메일을 보냈어요. '+nm+' 계정이 "초대 메일 보냄" 상태로 목록에 생겼어요.');
    focusId='iv-email';
    render();
  });
}

/* ===== 화면: 고객사 (관리자) ===== */
function ncPgs(ind){
  return Object.keys(INDS[ind].pgs).map(function(k){return '<label class="ck"><input type="checkbox" name="ncpg" value="'+k+'">'+esc(INDS[ind].pgs[k])+'</label>';}).join('');
}
function viewClients(){
  var can=ROLE==='siha_admin', keys=Object.keys(CLIENTS), nOn=count(keys,function(k){return CLIENTS[k].status==='active';});
  var h='<header class="ph"><div><h1>고객사</h1><p class="sub">고객사는 '+keys.length+'곳이고, 사용 중인 곳은 '+nOn+'곳이에요.</p></div></header>'+
    '<table class="tbl go"><thead><tr><th scope="col">이름</th><th scope="col">상태</th><th scope="col">산업</th><th scope="col" class="n">구독 제품군</th><th scope="col" class="n">계정</th><th scope="col" class="n">지금 보이는 질문</th></tr></thead><tbody>'+
    keys.map(function(k){
      var c=CLIENTS[k], u='#/admin/clients/'+k;
      return '<tr data-href="'+u+'"><td><a class="t" href="'+u+'">'+esc(c.name)+'</a></td><td class="nw" data-l="상태">'+(c.status==='active'?'사용 중':'<span class="tg tg-w">중지</span>')+'</td><td class="nw s" data-l="산업">'+esc(INDS[c.ind].name)+'</td>'+
        '<td class="n" data-l="구독 제품군">'+c.groups.length+'개</td><td class="n" data-l="계정">'+count(USERS,function(x){return x.client===k;})+'개</td><td class="n" data-l="보이는 질문"><b>'+clientQCount(k)+'건</b></td></tr>';
    }).join('')+'</tbody></table>';
  if(can){
    h+='<section class="sec"><details class="fm" id="nc-box"><summary>고객사 추가</summary><form id="nc-form" novalidate style="margin-top:8px;max-width:520px">'+
      '<div class="fld"><label for="nc-name">이름</label><input class="inp" id="nc-name" type="text" autocomplete="off"><p class="err" id="nc-name-e" hidden></p></div>'+
      '<div class="fld"><label for="nc-ind">산업</label><select class="sel" id="nc-ind">'+INDK.map(function(k){return '<option value="'+k+'">'+esc(INDS[k].name)+'</option>';}).join('')+'</select></div>'+
      '<fieldset class="fs"><legend>구독 제품군</legend><div class="cks" id="nc-pgs">'+ncPgs(INDK[0])+'</div><p class="err" id="nc-pg-e" hidden></p></fieldset>'+
      '<div class="acts"><button class="btn btn-p" type="submit">고객사 추가</button></div></form></details></section>';
  }else h+='<p class="note">시하 관리자만 바꿀 수 있어요. 지금은 읽기만 해요.</p>';
  return {title:'고객사',nav:'clients',html:h,init:function(){
    var f=document.getElementById('nc-form');
    if(!f)return;
    document.getElementById('nc-ind').addEventListener('change',function(e){document.getElementById('nc-pgs').innerHTML=ncPgs(e.target.value);});
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var nm=document.getElementById('nc-name').value.replace(/\s+/g,' ').trim(), ind=document.getElementById('nc-ind').value, bad='';
      var pgs=Array.prototype.map.call(f.querySelectorAll('input[name="ncpg"]:checked'),function(c){return c.value;});
      showErr('nc-name-e','','nc-name');showErr('nc-pg-e','');
      if(!nm){showErr('nc-name-e','이름을 적어 주세요. 예: 리빙 가구 D사','nc-name');bad='nc-name';}
      else if(Object.keys(CLIENTS).some(function(k){return CLIENTS[k].name===nm;})){showErr('nc-name-e','같은 이름의 고객사가 이미 있어요. 다른 이름으로 적어 주세요.','nc-name');bad='nc-name';}
      if(!pgs.length){showErr('nc-pg-e','구독할 제품군을 하나 이상 골라 주세요.');if(!bad)bad='nc-pg';}
      if(bad){(bad==='nc-pg'?f.querySelector('input[name="ncpg"]'):document.getElementById(bad)).focus();return;}
      var id='nc'+(++NCSEQ);
      CLIENTS[id]={name:nm,ind:ind,groups:pgs,brand:[nm],competitors:[],status:'active'};
      audit('고객사 추가',nm,INDS[ind].name+', 제품군 '+pgs.length+'개');
      setToast(nm+' 고객사를 추가했어요. 고객사 화면 미리 보기 목록에도 나와요.');
      toastKeep=true;
      go('#/admin/clients/'+id);
    });
  }};
}
function nameList(id,key,label,can){
  var arr=CLIENTS[id][key];
  return '<section class="sec"><h2>'+label+'</h2>'+
    (arr.length?'<ul class="rl">'+arr.map(function(x,i){
      return '<li><span>'+esc(x)+(key==='brand'&&i===0?' <span class="tag">대표 이름</span>':'')+'</span>'+(can&&!(key==='brand'&&i===0)?'<button class="btn" type="button" id="nd-'+key+'-'+i+'" data-nl="del" data-key="'+key+'" data-i="'+i+'" aria-label="'+esc(label+' 삭제: '+x)+'">삭제</button>':'')+'</li>';
    }).join('')+'</ul>':'<div class="empty sm"><p>아직 없어요.</p></div>')+
    (can?'<form class="inl" data-nl="add" data-key="'+key+'" style="margin-top:12px" novalidate><input class="inp" id="add-'+key+'" type="text" autocomplete="off" aria-label="'+label+' 추가" placeholder="'+(key==='brand'?'예: C사':'예: H사')+'"><button class="btn" type="submit">추가</button></form><p class="err" id="add-'+key+'-e" hidden></p>':'')+'</section>';
}
function viewClient(id){
  if(!has(CLIENTS,id))return viewMissing('고객사를 찾을 수 없어요','목록에서 다시 골라 주세요.','#/admin/clients','고객사 목록 보기','clients');
  var cl=CLIENTS[id], can=ROLE==='siha_admin', pgs=INDS[cl.ind].pgs, on=cl.status==='active';
  var h='<a class="back" href="#/admin/clients">고객사 목록으로 돌아가기</a><header class="ph"><div><h1>'+esc(cl.name)+'</h1><p class="sub">'+esc(cl.name)+eun(cl.name)+' '+esc(INDS[cl.ind].name)+' 고객사이고 지금 '+(on?'사용 중':'중지 상태')+'이에요. 구독 제품군 <span id="cl-gn">'+cl.groups.length+'</span>개, 계정 '+count(USERS,function(u){return u.client===id;})+'개예요.</p></div>'+
    '<p class="count" id="cl-n" role="status">이 고객사에 보이는 질문 <b>'+clientQCount(id)+'</b>건</p></header><div id="cl-main">'+
    (can?'':'<p class="note" style="margin:0 0 20px">시하 관리자만 바꿀 수 있어요. 지금은 읽기만 해요.</p>')+
    '<section><h2 id="cl-sub-h">구독 제품군</h2>'+(can?'<fieldset class="fs" style="margin-top:8px" aria-labelledby="cl-sub-h"><div class="cks">'+Object.keys(pgs).map(function(k){return '<label class="ck"><input type="checkbox" data-sub="'+k+'"'+(cl.groups.indexOf(k)>=0?' checked':'')+'>'+esc(pgs[k])+'</label>';}).join('')+'</div></fieldset><p class="note">체크를 바꾸면 위의 질문 수가 바로 바뀌고, 이 고객사 화면에도 바로 반영돼요.</p>':
      '<p style="margin-top:8px">'+(cl.groups.length?esc(cl.groups.map(function(k){return PGN[k];}).join(', ')):'<span class="unknown">구독한 제품군이 없어요.</span>')+'</p>')+'</section>'+
    nameList(id,'brand','브랜드 이름과 별칭',can)+nameList(id,'competitors','경쟁사',can)+
    '<section class="sec"><h2>상태</h2><p style="margin-top:8px">'+(on?'사용 중이에요.':'중지 상태예요. 이 고객사 계정은 고객사 화면을 볼 수 없어요.')+'</p>'+
    (can?'<p style="margin-top:12px"><button class="btn" type="button" id="cl-status">'+(on?'사용 중지':'다시 사용')+'</button></p>':'')+'</section>'+
    '<section class="sec"><h2>바로 가기</h2><ul class="lim"><li><a href="#/admin/users?aff='+id+'">이 고객사 계정 목록</a></li><li><a href="#/c/'+id+'">이 고객사 화면 미리 보기</a></li></ul></section></div>';
  return {title:cl.name,nav:'clients',html:h,init:function(){
    var main=document.getElementById('cl-main');
    if(!can)return;
    main.addEventListener('change',function(e){
      var k=e.target.getAttribute&&e.target.getAttribute('data-sub');
      if(!k)return;
      var was=cl.groups.indexOf(k)>=0;
      cl.groups=Object.keys(pgs).filter(function(x){return x===k?!was:cl.groups.indexOf(x)>=0;});
      audit('구독 변경',cl.name,'제품군 '+pgs[k]+(was?' 해제':' 추가'));
      document.getElementById('cl-gn').textContent=cl.groups.length;
      document.getElementById('cl-n').innerHTML='이 고객사에 보이는 질문 <b>'+clientQCount(id)+'</b>건';
    });
    main.addEventListener('click',function(e){
      var b=e.target.closest&&e.target.closest('[data-nl="del"]');
      if(b){
        var key=b.getAttribute('data-key'), i=Number(b.getAttribute('data-i')), nm=cl[key][i];
        cl[key].splice(i,1);
        audit('브랜드 변경',cl.name,(key==='brand'?'브랜드 이름 ':'경쟁사 ')+nm+' 삭제');
        focusId=cl[key].length>(key==='brand'?1:0)?'nd-'+key+'-'+Math.min(i,cl[key].length-1):'add-'+key;
        render();return;
      }
      if(e.target.id==='cl-status'){
        var op=e.target;
        confirmDlg(on?'이 고객사를 사용 중지할까요?':'이 고객사를 다시 사용할까요?',on?'중지하면 이 고객사 계정은 고객사 화면을 볼 수 없어요. 데이터는 그대로 남고, 언제든 다시 사용할 수 있어요.':'다시 사용하면 이 고객사 계정이 고객사 화면을 볼 수 있어요.',on?'사용 중지':'다시 사용',function(){
          cl.status=on?'suspended':'active';
          audit('고객사 상태',cl.name,on?'사용 중지':'다시 사용');
          setToast(cl.name+(on?' 사용을 중지했어요.':' 사용을 다시 시작했어요.'));
          focusId='cl-status';
          render();
        },op);
      }
    });
    main.addEventListener('submit',function(e){
      var f=e.target;
      if(!f.getAttribute||f.getAttribute('data-nl')!=='add')return;
      e.preventDefault();
      var key=f.getAttribute('data-key'), inp=document.getElementById('add-'+key), v=inp.value.replace(/\s+/g,' ').trim();
      showErr('add-'+key+'-e','','add-'+key);
      if(!v){showErr('add-'+key+'-e','이름을 적어 주세요. 예: '+(key==='brand'?'C사':'H사'),'add-'+key);inp.focus();return;}
      if(cl[key].indexOf(v)>=0){showErr('add-'+key+'-e','이미 있는 이름이에요. 다른 이름을 적어 주세요.','add-'+key);inp.focus();return;}
      cl[key].push(v);
      audit('브랜드 변경',cl.name,(key==='brand'?'브랜드 이름 ':'경쟁사 ')+v+' 추가');
      focusId='add-'+key;
      render();
    });
  }};
}

function adminRoute(p,r){
  var h=p[0]||'';
  if(p.length===0)return viewTrend(r);
  if(h==='review'&&p.length===1)return viewReview(r);
  if(h==='runs'&&p.length===1)return viewRuns(r);
  if(h==='clients'&&p.length===1)return viewClients();
  if(h==='clients'&&p.length===2)return viewClient(p[1]);
  if(h==='users'&&p.length===1)return viewUsers(r);
  if(p.length===1&&(h==='settings'||h==='sources'||h==='ideas'))return viewAdminSoon(h);
  return viewMissing('화면을 찾을 수 없어요','주소를 다시 확인해 주세요.','#/admin/review','검수 화면으로 가기','');
}

/* 메뉴는 역할로 정해요. kind: 'client'(고객사 화면), 'admin'(관리자 화면과 시하 내부 화면) */
/* 좁은 화면에서는 계정과 시안용 설정을 접어 두고, 다시 그려도 열림 상태를 이어 가요. 넓은 화면에서는 항상 펼쳐 둬요 */
var ACCT_NARROW=window.matchMedia('(max-width:760px)'), ACCT_OPEN=false;
ACCT_NARROW.addEventListener('change',function(){
  var d=document.getElementById('acct-d');
  if(d)d.open=ACCT_NARROW.matches?ACCT_OPEN:true;
});
function renderSide(nav,section,kind){
  var me=meUser(), cm=kind==='client', items, h;
  /* 항목: [화면 키, 주소, 이름, 위에 구분선, 3단계 예정, 덧붙이는 글자] */
  if(cm){
    items=[['home',C.base,'홈'],['trends',C.base+'/trends','주제 추이'],['questions',C.base+'/questions','질문 목록'],['communities',C.base+'/communities','커뮤니티 동향'],['reports',C.base+'/reports','주간 리포트'],['references',C.base+'/references',C.ind.refName]];
    if(ROLE==='client_admin')items.push(['members',C.base+'/members','계정 관리',1]);
    items.push(['ideas',C.base+'/ideas','콘텐츠 아이디어',1,1]);

      ['settings','#/admin/settings','조사 설정',1,1],['sources','#/admin/sources','출처',0,1],['aideas','#/admin/ideas','콘텐츠 아이디어',0,1]];

    items.map(function(it){
      return '<li'+(it[3]?' class="sep"':'')+'><a href="'+it[1]+'"'+(nav===it[0]?' aria-current="page"':'')+'>'+esc(it[2])+(it[5]?'<small>'+esc(it[5])+'</small>':'')+(it[4]?soon():'')+'</a></li>';
    }).join('')+'</ul>'+
    '</nav><details class="ac" id="acct-d"'+(ACCT_NARROW.matches?(ACCT_OPEN?' open':''):' open')+'><summary>계정과 시안용 설정</summary>'+
    (isSiha()?'<div class="pv"><label for="pv-sel">고객사 화면 미리 보기</label><select class="sel" id="pv-sel"><option value="">고객사를 골라 주세요</option>'+
      Object.keys(CLIENTS).map(function(k){return '<option value="'+k+'"'+(cm&&k===C.id?' selected':'')+'>'+esc(CLIENTS[k].name)+'</option>';}).join('')+'</select></div>':'')+
    '<div class="acct"><strong>'+esc(me.name)+'</strong><span>'+ROLEN[ROLE]+(isSiha()?'':', '+esc(CLIENTS[CL]?CLIENTS[CL].name:''))+'</span>'+
    '<div class="dm"><b>시안용</b>'+

/* ===== 라우터: #/siha(시하 내부), #/c/고객사ID/화면(고객사) ===== */
var view=document.getElementById('view'), prevPath=null, skipNext=false;
function parse(){
  var h=location.hash.replace(/^#/,''), i=h.indexOf('?');
  var p=i>=0?h.slice(0,i):h, q=i>=0?h.slice(i+1):'';
  var parts=p.split('/').filter(Boolean).map(function(s){try{return decodeURIComponent(s);}catch(e){return s;}});
  return {parts:parts,params:new URLSearchParams(q)};
}
function route(p,r){
  if(p.length===0)return viewHome();
  if(p.length===1){
    if(p[0]==='communities')return viewCommunities(r);
    if(p[0]==='questions')return viewQuestions(r);
    if(p[0]==='reports')return viewReports();
    if(p[0]==='references')return viewRefs(r);
    if(p[0]==='ideas')return viewIdeas(r);
    if(p[0]==='trends')return viewTrends(r);
    if(p[0]==='members')return viewMembers();
  }
  /* 브랜드 이슈와 반응 인사이트는 시하 내부 화면에만 있어요 */
  if(p[0]==='issues'||p[0]==='insights'){
    return viewMissing('볼 수 없는 화면이에요','브랜드 이슈와 반응 인사이트는 고객사 화면에서 볼 수 없어요.',C.base,'홈으로 가기','');
  }
  if(p.length===2){
    if(p[0]==='questions')return viewQuestion(p[1]);
    if(p[0]==='reports')return viewReport(p[1]);
  }
  return viewMissing('화면을 찾을 수 없어요','주소를 다시 확인해 주세요.',C.base,'홈으로 가기','');
}
function render(){
  if(skipNext){skipNext=false;return;}
  var r=parse(), p=r.parts, path='/'+p.join('/'), rest=p, v, kind='admin', banner='', head=p[0]||'';
  var af=document.activeElement, keyHref=af&&af.getAttribute?af.getAttribute('href'):null, keyId=af&&af.id?af.id:null;
  var own=has(CLIENTS,CL)?CL:DEFAULT;
  if(MODAL&&path!==prevPath)closeModal(true);
  if(p.length===0||(p.length===1&&head==='login')){setClient(DEFAULT);rest=[];v=viewLogin();kind='login';}
  else if(head==='admin'){
    setSiha();rest=p.slice(1);
    if(isSiha())v=adminRoute(rest,r);
    else{setClient(own);kind='client';v=viewMissing('볼 수 없는 화면이에요','고객사 계정에는 관리자 화면이 열리지 않아요.','#/c/'+own,'내 화면으로 가기','');}
  }
  else if(head==='siha'){
    /* 시하 내부 화면(반응 인사이트, 브랜드 이슈, 통합 동향). 메뉴에는 없지만 주소로는 열려요 */
    if(!isSiha()){setClient(own);kind='client';rest=[];v=viewMissing('볼 수 없는 화면이에요','시하 내부 화면은 고객사 계정에 열리지 않아요.','#/c/'+own,'내 화면으로 가기','');}
    else{
      setSiha();rest=p.slice(1);
      if(rest.length===0){location.hash='#/admin';return;}
      else if(rest.length===1&&rest[0]==='insights')v=viewInsights(r);
      else if(rest.length===1&&rest[0]==='communities')v=viewSihaComm(r);
      else if(rest.length===1&&rest[0]==='questions')v=viewQuestions(r);
      else if(rest.length===2&&rest[0]==='questions')v=viewQuestion(rest[1]);
      else if(rest.length===1&&rest[0]==='issues')v=viewIssues(r);
      else if(rest.length===2&&rest[0]==='issues')v=viewIssue(rest[1]);
      else v=viewMissing('화면을 찾을 수 없어요','주소를 다시 확인해 주세요.','#/admin/review','검수 화면으로 가기','');
    }
  }
  else if(head==='c'&&p[1]==='cesco'){location.hash=location.hash.replace('#/c/cesco','#/c/hygc');return;}
  else if(head==='c'){
    kind='client';rest=p.slice(2);
    if(p.length>1&&has(CLIENTS,p[1])){
      setClient(p[1]);
      if(!isSiha()&&p[1]!==CL){setClient(own);rest=[];v=viewMissing('볼 수 없는 화면이에요','다른 고객사 화면은 열 수 없어요.','#/c/'+own,'내 고객사 화면으로 가기','');}
      else if(!isSiha()&&CLIENTS[p[1]].status!=='active'){rest=[];v=viewMissing('볼 수 없는 화면이에요','이 고객사는 사용이 중지됐어요. 시하 담당자에게 문의해 주세요.','#/login','로그인 화면으로 가기','');}
      else{
        v=route(rest,r);
        if(isSiha())banner='<p class="pvb noprint">시하 계정으로 미리 보는 중이에요. '+(CLIENTS[p[1]].status==='active'?'':'이 고객사는 지금 사용 중지 상태예요. ')+'<a href="#/admin">관리자 화면으로 돌아가기</a></p>';
      }
    }
    else{setClient(own);rest=[];v=viewMissing('고객사를 찾을 수 없어요','주소를 다시 확인해 주세요.',isSiha()?'#/admin/clients':'#/c/'+own,isSiha()?'고객사 목록 보기':'홈으로 가기','');}
  }else{
    if(isSiha())setSiha();else{setClient(own);kind='client';}
    rest=[];v=viewMissing('화면을 찾을 수 없어요','주소를 다시 확인해 주세요.',homeHash(),'처음으로 가기','');
  }
  document.body.classList.toggle('is-login',v.login===true);
  renderSide(v.nav,rest[0]||'',kind);
  view.innerHTML=banner+v.html;
  document.title=v.title+' | 시하 리서치';
  document.getElementById('foot-note').textContent=v.foot||FOOT_DEFAULT;
  if(v.init)v.init();
  var fid=focusId, fel=fid?document.getElementById(fid):null;
  focusId=null;
  if(path!==prevPath){if(toastKeep)toastKeep=false;else setToast('');}
  if(fel&&fel.focus){
    if(path!==prevPath)window.scrollTo(0,0);
    fel.focus();
  }
  else if(path===prevPath){
    var target=null;
    if(keyId)target=document.getElementById(keyId);
    if(!target&&keyHref){
      var as=view.querySelectorAll('a');
      for(var j=0;j<as.length;j++){if(as[j].getAttribute('href')===keyHref){target=as[j];break;}}
    }
    if(target&&target.focus)target.focus();
  }else{
    window.scrollTo(0,0);
    if(prevPath!==null&&!v.login){var h1=view.querySelector('h1');if(h1){h1.setAttribute('tabindex','-1');h1.focus({preventScroll:true});}}
  }
  prevPath=path;
}
view.addEventListener('click',function(e){
  if(!e.target.closest||e.target.closest('a,button,select,input,summary'))return;
  var tr=e.target.closest('tr[data-href]');
  if(tr&&!String(window.getSelection?window.getSelection():''))location.hash=tr.getAttribute('data-href');
});
view.addEventListener('change',function(e){
  var t=e.target;
  if(t&&t.hasAttribute&&t.hasAttribute('data-go'))location.hash=t.value;
});
/* 기간 직접 선택: 시작일과 종료일을 주소에 남겨요 */
view.addEventListener('submit',function(e){
  var f=e.target;
  if(f&&f.getAttribute&&f.getAttribute('data-pbase')){
    e.preventDefault();
    location.hash=f.getAttribute('data-pbase')+'&from='+encodeURIComponent(f.elements.from.value)+'&to='+encodeURIComponent(f.elements.to.value);
  }
});
document.getElementById('skip').addEventListener('click',function(){document.getElementById('main').focus();});
window.addEventListener('hashchange',render);
render();
})();
</script>
</body>
</html>
